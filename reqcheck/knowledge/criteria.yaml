# Критерии качества требований: ISO/IEC/IEEE 29148:2018 п. 5.2.5–5.2.7, IEEE 830-1998 п. 4.3.
# Один источник определений для всех шагов агента.

individual:
  НЕОБХ:
    name: Необходимость
    standard: 29148 п. 5.2.5 a
    definition: Требование выражает реальную потребность; без него система не выполнит цель или нарушит ограничение.
    check:
      - Что сломается или не будет достигнуто, если требование удалить?
      - Не дублирует ли оно другое требование?
    defects:
      - Дубль другого требования.
      - «Хотелка» без связи с целью.
  УМЕСТ:
    name: Уместность
    standard: 29148 п. 5.2.5 b
    definition: Уровень детализации соответствует уровню документа; нет лишних проектных решений, навязанных без причины.
    check:
      - Описано «что» нужно, а не «как» реализовать?
      - Не попали ли в бизнес-требования детали БД, фреймворки, имена таблиц без обоснования?
    defects:
      - Конкретная технология или схема хранения без причины.
      - Правило одного компонента описано в спецификации другого.
  ОДНОЗН:
    name: Однозначность
    standard: 29148 п. 5.2.5 c и 5.2.7; IEEE 830 п. 4.3.2
    definition: Требование допускает ровно одно толкование для бизнеса, разработки и тестирования.
    check:
      - Нет ли размытых слов (быстро, удобно, своевременно, по возможности, и т.д.)?
      - Однозначны ли ссылки и условия (что такое «месяц», «в момент», «в городе» или «по времени»)?
      - Определены ли термины и единицы?
    defects:
      - Субъективные прилагательные и наречия.
      - Условие с двумя трактовками.
      - Неопределённое местоимение или ссылка.
  ПОЛН:
    name: Полнота
    standard: 29148 п. 5.2.5 d
    definition: Требование описывает возможность полностью — входы, условия, ограничения, ожидаемые результаты, ошибки — и не требует догадок.
    check:
      - Указаны ли границы, значения по умолчанию, единицы и форматы?
      - Что происходит при ошибке, отказе, повторе, отмене, граничном значении?
      - Для всех ли состояний и ролей определено поведение?
    defects:
      - Не описана обработка ошибок и граничных случаев.
      - Нет значения по умолчанию или условия применимости.
  ЕДИН:
    name: Единичность
    standard: 29148 п. 5.2.5 e
    definition: Требование описывает одну возможность или одно ограничение; несколько утверждений разнесены по отдельным требованиям.
    check:
      - Можно ли выполнить одну часть пункта и не выполнить другую?
    defects:
      - Несколько независимых правил в одном пункте — их нельзя трассировать и проверять по отдельности.
  ОСУЩ:
    name: Осуществимость
    standard: 29148 п. 5.2.5 f
    definition: Требование реализуемо в рамках принятой архитектуры, стандартов и ограничений с приемлемым риском.
    check:
      - Не нарушает ли требование стандарт протокола или ограничения внешней системы?
      - Достижимо ли оно вообще (100% доступность, «мгновенно»)?
    defects:
      - Изменение данных через безопасный HTTP-метод.
      - Обещание результата, который зависит от внешних систем.
  ПРОВ:
    name: Проверяемость
    standard: 29148 п. 5.2.5 g; IEEE 830 п. 4.3.6
    definition: Существует конечный и экономически оправданный способ проверить выполнение — тест с однозначным ожидаемым результатом.
    check:
      - Можно ли написать тест с конкретным ожидаемым результатом?
      - Есть ли измеримый критерий (число, процентиль, условие измерения)?
    defects:
      - Нет измеримого критерия.
      - SLA без процентиля, нагрузки и точки измерения.
      - Требование о том, что вне контроля системы («клиент получит»).
  КОРР:
    name: Корректность
    standard: 29148 п. 5.2.5 h; IEEE 830 п. 4.3.1
    definition: Требование точно отражает потребность и не противоречит фактам предметной области; расчёты верны.
    check:
      - Нет ли ошибки в формуле или расчёте?
      - Верно ли использованы понятия предметной области?
    defects:
      - Арифметическая ошибка, неверная формула (маржа вместо наценки).
      - Неверное утверждение о предметной области.
  СООТВ:
    name: Соответствие
    standard: 29148 п. 5.2.5 i
    definition: Требование соответствует принятому шаблону, стилю и стандартам организации.
    check:
      - Заполнены ли обязательные поля шаблона?
      - Соблюдён ли принятый стиль формулировок?
    defects:
      - Незаполненный чек-лист ревью или поле шаблона.
      - Посторонние указания в тексте требований.

set:
  Н-ПОЛН:
    name: Полнота набора
    standard: 29148 п. 5.2.6 a; IEEE 830 п. 4.3.3
    definition: Набор покрывает весь процесс от триггера до результата, включая негативные сценарии, роли, данные, интеграции и НФТ; нет пустых разделов и заглушек.
  Н-СОГЛ:
    name: Непротиворечивость
    standard: 29148 п. 5.2.6 b; IEEE 830 п. 4.3.4
    definition: Требования не конфликтуют между собой и со связанными документами; единицы, типы и термины согласованы.
  Н-ОСУЩ:
    name: Осуществимость набора
    standard: 29148 п. 5.2.6 c
    definition: Весь набор реализуем вместе в рамках ограничений проекта и стандартов.
  Н-ПОНЯТ:
    name: Понятность
    standard: 29148 п. 5.2.6 d
    definition: "Набор понятен всем сторонам: единая терминология, определённые сокращения, ясная структура."
  Н-ВАЛИД:
    name: Валидируемость
    standard: 29148 п. 5.2.6 e
    definition: "По набору можно подтвердить, что система решит бизнес-задачу: есть измеримые цели и критерии приёмки."
  Н-РАНЖ:
    name: Ранжированность
    standard: IEEE 830 п. 4.3.5
    definition: Требования имеют приоритет и признак стабильности.
  Н-МОДИФ:
    name: Модифицируемость
    standard: IEEE 830 п. 4.3.7
    definition: "Структура позволяет менять требования без каскада правок: нет дублей, есть версия и история изменений."
  Н-ТРАСС:
    name: Прослеживаемость
    standard: IEEE 830 п. 4.3.8
    definition: У каждого требования уникальный ID; прослеживается цель → требование → API/данные → критерии приёмки.
