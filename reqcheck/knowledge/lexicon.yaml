# Размытые и незамкнутые формулировки (ISO/IEC/IEEE 29148 п. 5.2.7). Мягкие подсказки для модели.
- pattern: '\bбыстр(?:о|ый|ая|ое|ые|ее|ого|ой|ому)\b'
  label: субъективная оценка скорости без числа
  criterion: ПРОВ
  nfr: true
  hint: Указать измеримый порог — время, процентиль, нагрузку и точку измерения.
- pattern: '\bудобн\w*'
  label: субъективная оценка удобства
  criterion: ПРОВ
  hint: Заменить проверяемыми критериями (число шагов, время выполнения сценария, требования к элементам).
- pattern: '\bинтуитивн\w*'
  label: субъективная оценка, не проверяется тестом
  criterion: ПРОВ
- pattern: '\bсвоевременн\w*'
  label: срок не определён
  criterion: ОДНОЗН
  hint: Указать срок и событие, от которого он отсчитывается.
- pattern: '\bоперативн\w*'
  label: срок не определён
  criterion: ОДНОЗН
- pattern: '\bнад[её]жн\w*'
  label: качество без метрики
  criterion: ПРОВ
  nfr: true
- pattern: '\bэффективн\w*'
  label: качество без метрики
  criterion: ПРОВ
- pattern: '\bоптимальн\w*'
  label: критерий оптимальности не задан
  criterion: ОДНОЗН
- pattern: '\bдостаточн\w*'
  label: порог «достаточности» не задан
  criterion: ОДНОЗН
- pattern: '\bмаксимально\b|\bминимально\b'
  label: экстремум без числа
  criterion: ОДНОЗН
- pattern: '\bпо\s+возможности\b'
  label: незамкнутое условие («лазейка»)
  criterion: ОДНОЗН
  hint: Убрать оговорку или задать условие, при котором требование не выполняется.
- pattern: '\bпри\s+необходимости\b|\bв\s+случае\s+необходимости\b|\bесли\s+потребуется\b'
  label: не определено, кто и когда решает о необходимости
  criterion: ОДНОЗН
- pattern: '\bкак\s+правило\b'
  label: правило с неопределёнными исключениями
  criterion: ОДНОЗН
- pattern: '\bи\s+т\.\s?[дп]\.|\bи\s+др\.|\bи\s+прочее\b|\bи\s+так\s+далее\b|\bи\s+далее\b'
  label: незамкнутый перечень
  criterion: ПОЛН
  hint: Перечислить все элементы или задать правило отнесения.
- pattern: '\bвключая,?\s+но\s+не\s+ограничиваясь\b|\bв\s+том\s+числе\b'
  label: открытый перечень
  criterion: ПОЛН
- pattern: '\bлегк(?:о|ий|ая|ое|ие)\b'
  label: субъективная оценка
  criterion: ПРОВ
- pattern: '\bсовременн\w*'
  label: субъективная оценка
  criterion: ПРОВ
- pattern: '\bгибк\w*'
  label: качество без метрики
  criterion: ПРОВ
- pattern: '\bмасштабируем\w*'
  label: масштабируемость без целевых значений нагрузки
  criterion: ПРОВ
  nfr: true
- pattern: '\bвысок(?:ая|ой|ую|ие|ий|ое)\s+(?:доступност|производительност|над[её]жност|скорост|качеств)\w*'
  label: уровень качества без метрики
  criterion: ПРОВ
  nfr: true
- pattern: '\bмгновенн\w*|\bмоментальн\w*|\bв\s+реальном\s+времени\b|\bсразу\s+же\b'
  label: время реакции без измеримого значения
  criterion: ПРОВ
  nfr: true
- pattern: '\bи/или\b'
  label: двусмысленное «и/или»
  criterion: ОДНОЗН
- pattern: '\bнекотор(?:ых|ые|ым|ой|ая)\b'
  label: неопределённое количество
  criterion: ОДНОЗН
- pattern: '\bсоответствующ\w+\s+образом\b|\bпри\s+соответствующ\w+'
  label: неопределённая ссылка («соответствующий» — какой?)
  criterion: ОДНОЗН
- pattern: '\bпримерно\b|\bприблизительно\b|\bоколо\s+\d|\bпорядка\s+\d'
  label: приблизительное значение
  criterion: ОДНОЗН
- pattern: '\bвсегда\b|\bникогда\b|\b100\s?%|\bни\s+при\s+каких\b|\bв\s+любом\s+случае\b|\bгарантированн\w*|\bабсолютн\w*'
  label: абсолютная формулировка — недостижима или не проверяется (INCOSE R26)
  criterion: ПРОВ
  hint: Заменить абсолют измеримым значением с допуском и условиями.
- pattern: '\bжелательно\b|\bрекомендуется\b|\bпо\s+желанию\b|\bопционально\b|\bпредпочтительно\b|\bпо\s+усмотрению\b'
  label: необязательная формулировка — непонятно, обязательно ли требование
  criterion: ОДНОЗН
  hint: Решить, обязательно ли требование; необязательное вынести в отдельный список с приоритетом.
