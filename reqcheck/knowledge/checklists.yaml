# Контекстные чек-листы предметной области. Шаг выбирает подходящие по типам требований и ключевым словам.
# kinds — типы требований (ReqKind), triggers — регулярные выражения по тексту.

- id: money
  title: Деньги и единицы
  kinds: [functional, data, api, business]
  triggers: ['₸', 'тенге', 'тиын', 'сумм', 'комисси', 'тариф', 'лимит', 'платеж', 'платёж', 'KZT', 'USD']
  items:
    - Единица суммы задана явно (тенге или тиыны) и одинакова в требованиях, API и данных; есть правило пересчёта и округления.
    - Границы диапазонов включены или исключены явно; что при нуле, отрицательном значении, переполнении типа.
    - Валюта операции и счёта; курс и момент конвертации для операций в другой валюте.
    - База для процентов и комиссий указана (от суммы операции, от остатка, от оборота).
- id: time
  title: Время и периоды
  kinds: [functional, nfr, data, acceptance, process]
  triggers: ['врем', 'дата', 'месяц', 'сутк', 'день', 'час', 'минут', 'UTC', 'пояс', 'период', 'срок']
  items:
    - Часовой пояс задан явно (например, Asia/Almaty, UTC+5), а не названием города.
    - Какое событие задаёт время — совершение, авторизация, проведение, клиринг, получение события.
    - Поведение на границе суток и месяца; календарный или скользящий период.
    - SLA и сроки — с точкой отсчёта и окончания, процентилем и условиями.
    - Поздно пришедшие события относятся к какому периоду.
- id: cards
  title: Карточные операции
  kinds: [functional, data, integration, process]
  triggers: ['карт', 'процессинг', 'покупк', 'авторизац', 'клиринг', 'возврат', 'снятие', 'перевод', 'MCC', 'эквайринг']
  items:
    - Статус карты (активна, заблокирована, истекла, перевыпущена) — что с настройками и накоплениями.
    - Несколько карт и дополнительные карты — держатель и владелец счёта могут различаться.
    - Типы операций и их классификация (покупка, перевод, снятие, квази-кэш, платёж, комиссия), признак отнесения (MCC, тип операции).
    - "Авторизация или клиринг: какое событие учитывается; отмена авторизации; частичное списание."
    - "Возвраты: полный, частичный, в другом периоде, без исходной операции, больше суммы периода; chargeback."
    - "Повторная доставка и порядок событий: ключ дедупликации, возврат раньше покупки."
- id: notifications
  title: Уведомления
  kinds: [functional, nfr, integration]
  triggers: ['push', 'пуш', 'уведомлен', 'SMS', 'смс', 'оповещ', 'e-mail', 'email']
  items:
    - "Система отвечает за отправку, а не за доставку: доставка зависит от ОС, сервисов push и разрешений пользователя."
    - "Что при недоступности сервиса уведомлений и отключённых уведомлениях на устройстве: повтор, резервный канал."
    - Текст уведомления, локализация, какие данные показываются на экране блокировки (приватность).
    - Частота и лимиты, тихие часы, повторная отправка, отписка.
- id: api
  title: HTTP API
  kinds: [api, integration]
  triggers: ['GET', 'POST', 'PUT', 'DELETE', 'REST', 'API', 'endpoint', 'URL', 'запрос', 'ответ', 'статус', 'код']
  items:
    - Метод соответствует семантике (RFC 9110) — GET и HEAD не меняют состояние; изменения через POST, PUT, PATCH.
    - Чувствительные данные (номер карты, токены, персональные данные) не передаются в URL и query-строке.
    - Каждый код ответа описан с условием и примером; исход определяется кодом, а не телом 2xx с ошибкой.
    - Типы и форматы полей одинаковы в запросе, ответе и модели данных; обязательность и значения по умолчанию заданы.
    - Ошибки валидации — какой код и тело для каждого правила; доступ к чужим объектам.
    - Идемпотентность повторных запросов, конкурентные изменения, ограничение частоты.
    - Окружения и адреса (dev, prod), версия API, контракт (OpenAPI).
    - Есть методы для всех операций, которые нужны интерфейсу (чтение и запись).
- id: data_security
  title: Данные и безопасность
  kinds: [data, api, integration, nfr]
  triggers: ['хранит', 'данн', 'идентификатор', 'PAN', 'номер карты', 'персональн', 'токен', 'логир', 'аудит', 'Bearer', 'авторизац']
  items:
    - Состав данных, единицы, ключи и уникальность, связи (например, возврат ↔ исходная операция).
    - История изменений настроек, срок хранения и удаление данных.
    - Номер карты только токеном или маскированно (PCI DSS); персональные данные защищены.
    - "Чувствительные данные не попадают в логи; аудит изменений: кто, когда, что изменил."
    - Роли и права доступа; проверка принадлежности объекта пользователю.
- id: nfr
  title: Нефункциональные требования
  kinds: [nfr]
  triggers: ['нефункц', 'производит', 'доступност', 'нагрузк', 'SLA', 'отказоуст', 'в течение', 'не более']
  items:
    - Производительность — метрика, процентиль (p95/p99), нагрузка, точка измерения, какой компонент.
    - Доступность (SLA, окна обслуживания), поведение при деградации и отказе зависимостей.
    - Пиковая нагрузка и масштабирование.
    - Мониторинг, алерты, логирование.
    - Безопасность, совместимость (версии ОС и приложения), сопровождаемость.
- id: business_case
  title: Бизнес-обоснование и расчёты
  kinds: [business]
  triggers: ['выручк', 'доход', 'маржа', 'маржинал', 'затрат', 'расход', 'прибыл', 'окупаем', 'NPV', 'IRR', 'ROI', 'бюджет', 'CAPEX', 'OPEX', 'unit', 'юнит', 'LTV', 'CAC']
  items:
    - Цели и KPI измеримы — база, целевое значение, срок, способ измерения.
    - Формулы верны — маржа и наценка, валовая и чистая; база процентов.
    - Периоды и единицы согласованы — месяц и год, тыс. и млн, валюта; учтены рост и отток.
    - NPV, IRR и окупаемость — ставка, горизонт, дисконтирование, определение срока окупаемости; сходится с потоками.
    - Одни и те же цифры одинаковы в разных разделах (цели, KPI, финмодель, бюджет).
    - Допущения явные; есть анализ чувствительности.
- id: process_ui
  title: Процесс и интерфейс
  kinds: [ui, process, functional]
  triggers: ['экран', 'кнопк', 'поле', 'интерфейс', 'UI', 'BPMN', 'процесс', 'шаг', 'переключател', 'сообщени']
  items:
    - Процесс от триггера до завершения, альтернативные и ошибочные ветки, роли.
    - Состояния и переходы, значения по умолчанию, пустые состояния.
    - Валидация ввода — какие ошибки, тексты сообщений, где показываются.
    - Ошибка сервера или сети при сохранении — что видит пользователь.
    - Для каждого элемента экрана есть источник данных и метод сохранения.
- id: doc_hygiene
  title: Оформление документа
  kinds: []
  triggers: ['верси', 'согласу', 'чек-лист', 'ревью', 'заполня', 'шаблон']
  items:
    - Версия, дата, автор, история изменений.
    - Согласующие и статус согласования.
    - Нет пустых разделов и заглушек.
    - Уникальные идентификаторы требований, приоритеты.
    - Ссылки на внешние документы — с названием и версией, документы доступны.
