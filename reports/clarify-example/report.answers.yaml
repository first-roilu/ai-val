questions:
- id: Q-01
  question: 'Какое событие и какой часовой пояс определяют месяц, к которому относится покупка: дата авторизации
    или дата проведения процессингом, и всегда ли это Asia/Almaty (UTC+5)?'
  options:
    1: 'Оставить как есть: месяц определяется по дате совершения покупки в Алматы, критерий приёмки переписать под
      это правило'
    2: Месяц определяется по дате проведения (клиринга) процессингом, Ф-2 переписать
    3: Месяц определяется по дате авторизации, а поздний клиринг относится к месяцу авторизации
    4: Месяц определяется по дате получения события сервисом расходов
  findings:
  - D-002
  - D-014
  - D-017
  answer: 'Вариант 1: Оставить как есть: месяц определяется по дате совершения покупки в Алматы, критерий приёмки
    переписать под это правило'
- id: Q-02
  question: Сбрасывает ли изменение порога признак «push за этот месяц уже отправлен», и должен ли клиент получить
    второй push в том же календарном месяце при достижении нового порога?
  options:
    1: 'Оставить как есть: лимит не сбрасывается, второй push в том же месяце не отправляется, Ф-4 дополнить этим
      условием'
    2: Смена порога сбрасывает лимит, клиент получает push по новому порогу в том же месяце
    3: Лимит не сбрасывается, но при понижении порога ниже накопленной суммы push отправляется один раз
    4: Лимит считается на каждую настройку порога отдельно
  findings:
  - D-003
  - D-018
  answer: 'Вариант 1: Оставить как есть: лимит не сбрасывается, второй push в том же месяце не отправляется, Ф-4
    дополнить этим условием'
- id: Q-03
  question: Какой метод должен читать действующие настройки и сумму расходов за месяц, и допустимо ли изменить метод
    и URL сохранения с GET на POST/PUT относительно уже согласованного с мобильным приложением контракта?
  options:
    1: 'Оставить как есть: запись через GET допустима, контракт с приложением не меняется'
    2: 'Разделить: POST/PUT для сохранения и отдельный GET для чтения настроек и суммы за месяц'
    3: Оставить один GET, но добавить в его ответ сумму за месяц и считать это чтением настроек
    4: Сумму за месяц приложение берёт напрямую из сервиса расходов, сервис настроек её не отдаёт
  findings:
  - D-004
  - D-001
  - D-043
  answer: 'Вариант 2: Разделить: POST/PUT для сохранения и отдельный GET для чтения настроек и суммы за месяц'
- id: Q-04
  question: Какой HTTP-код и тело должен получить клиент при amount вне диапазона 1 000–1 000 000, и что считается
    успехом операции — код ответа или поле result?
  options:
    1: 'Оставить как есть: 200 с result ERROR для суммы вне диапазона, 400 для отсутствующих параметров'
    2: Все ошибки валидации, включая сумму вне диапазона, возвращают 400 с телом ошибки
    3: Успех определяется только полем result, коды 200/201 считать равнозначными
    4: Ввести 422 для ошибок валидации значения
  findings:
  - D-005
  - D-034
  - D-033
  - D-032
  - D-035
  answer: 'Вариант 2: Все ошибки валидации, включая сумму вне диапазона, возвращают 400 с телом ошибки'
- id: Q-05
  question: В каких единицах передаётся и сравнивается amount — в тенге или тиынах, где выполняется пересчёт и как
    округляется накопленная сумма при сравнении с целым порогом?
  options:
    1: 'Оставить как есть: amount в тенге, сумма покупки в тиынах, пересчёт выполняет сервис расходов'
    2: Всё хранить и сравнивать в тиынах, в API передавать тиыны
    3: Всё в тенге, суммы покупок конвертируются в тенге при приёме события
    4: amount в тенге, enabled как boolean, пересчёт на стороне клиента
  findings:
  - D-025
  - D-030
  - D-019
  answer: 'Вариант 1: Оставить как есть: amount в тенге, сумма покупки в тиынах, пересчёт выполняет сервис расходов'
- id: Q-06
  question: 'По какому признаку операция относится к «покупкам»: по типу операции процессинга или по MCC, и какие
    типы операций включаются и исключаются (платёж за услуги, квази-кэш, комиссия, пополнение)?'
  options:
    1: 'Оставить как есть: все операции, кроме переводов и снятия наличных, считаются покупками'
    2: Считать по списку MCC, исключать квази-кэш, комиссии и пополнения
    3: Считать по типу операции процессинга с явным перечнем типов
    4: Считать только операции с MCC из отдельного согласованного перечня и включать квази-кэш
  findings:
  - D-015
  answer: 'По типу операции процессинга: покупки и оплата услуг считаются; переводы, снятие наличных, квази-кэш
    и комиссии банка исключаются'
- id: Q-07
  question: 'Как учитывать возвраты: каким событием процессинга они передаются, как связываются с исходной покупкой
    и что делать при возврате без исходной операции или при превышении расходов месяца?'
  options:
    1: 'Оставить как есть: учитываются только возвраты с найденной исходной покупкой, остальные игнорируются'
    2: Возврат уменьшает расходы месяца исходной покупки; при отсутствии исходной — месяц возврата
    3: Возврат без исходной операции не учитывается, счётчик не может стать отрицательным
    4: Возврат учитывается в месяце возврата всегда, независимо от исходной покупки
  findings:
  - D-013
  - D-021
  answer: 'Вариант 2: Возврат уменьшает расходы месяца исходной покупки; при отсутствии исходной — месяц возврата'
- id: Q-09
  question: Отправляется ли push, если переключатель уведомления по карте выключен, и что сохраняется с порогом
    при выключении и повторном включении?
  options:
    1: 'Оставить как есть: push отправляется при достижении порога независимо от переключателя'
    2: Push отправляется только при enabled=1, порог сохраняется между выключением и включением
    3: При enabled=0 push не отправляется, порог сбрасывается в значение по умолчанию
    4: При enabled=0 push не отправляется, amount при выключении необязателен
  findings:
  - D-016
  - D-031
  - D-009
  answer: 'Вариант 2: Push отправляется только при enabled=1, порог сохраняется между выключением и включением'
