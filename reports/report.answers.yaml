questions:
- id: Q-01
  priority: 1
  addressee: Бизнес
  question: Отправляется ли push, если уведомление по карте выключено переключателем (enabled = 0), но накопленные
    расходы перешли сохранённый порог?
  options:
    1: 'Нет: при enabled = 0 push не отправляется, накопленная сумма продолжает считаться, а лимит «один push в
      месяц» не расходуется'
    2: 'Нет: при enabled = 0 push не отправляется, но лимит расходуется, как если бы уведомление было отправлено'
    3: 'Да: push отправляется всегда при переходе через порог, переключатель влияет только на отображение настроек'
  recommended: 'Первый вариант: он соответствует смыслу выключенного уведомления, сохраняет данные для корректной
    работы после включения и исключает неожиданные push.'
  findings:
  - D-001
  answer: ''
- id: Q-02
  priority: 1
  addressee: Бизнес
  question: Сбрасывает ли изменение порога или переключателя ограничение «один push на карту в календарный месяц»,
    и отправляется ли push сразу при снижении порога ниже уже накопленной суммы или при включении уведомления?
  options:
    1: 'Лимит не сбрасывается: второй push в том же месяце не отправляется, при снижении порога или включении push
      не отправляется'
    2: Лимит не сбрасывается, но при снижении порога ниже накопленной суммы или при включении отправляется один
      push в счёт месячного лимита
    3: 'Лимит сбрасывается при любом изменении настроек: после сохранения нового порога клиент может получить второй
      push в том же месяце'
  recommended: 'Второй вариант: он защищает клиента от спама, но выполняет обещание Ф-4 и закрывает очевидный сценарий
    снижения порога и включения уведомления.'
  findings:
  - D-002
  - D-019
  answer: ''
- id: Q-03
  priority: 1
  addressee: Архитектор
  question: Каким HTTP-методом должно выполняться сохранение порога — PUT/POST с телом запроса или текущий GET с
    параметрами в query-строке зафиксирован внешней системой?
  options:
    1: PUT с параметрами в теле запроса
    2: POST с параметрами в теле запроса
    3: 'Оставить GET: контракт с мобильным приложением уже зафиксирован и менять его нельзя (потребуется отдельное
      обоснование и согласование с ИБ)'
  recommended: 'PUT: ресурс настроек карты идемпотентно заменяется, параметры уходят в тело и не попадают в логи
    и историю.'
  findings:
  - D-005
  answer: ''
- id: Q-04
  priority: 1
  addressee: Аналитик
  question: Какой ответ должен получить клиент при сумме вне диапазона 1 000–1 000 000 ₸ и при недопустимом enabled
    — HTTP 400 с сообщением или HTTP 200 с result = ERROR, и содержит ли тело ошибки имя неверного параметра?
  options:
    1: HTTP 400 с телом {message} и указанием имени параметра; result = ERROR из успешных ответов убрать
    2: HTTP 200 с result = ERROR и прежними значениями настройки в полях amount и enabled
    3: HTTP 400 при любом неверном параметре, с массивом ошибок по каждому полю
  recommended: 'Первый вариант: 4xx для ошибки валидации — общепринятая практика, а имя параметра позволяет показать
    сообщение под полем; массив ошибок добавить, если нужна поддержка двух неверных параметров одновременно.'
  findings:
  - D-006
  - D-032
  - D-036
  answer: ''
- id: Q-05
  priority: 1
  addressee: Архитектор
  question: Откуда экран «Уведомления» берёт текущий порог, признак включения и «сумму за месяц» — тем же сервисом
    настроек отдельным методом чтения, сервисом расходов или расчётом на клиенте?
  options:
    1: Отдельный GET-метод сервиса настроек возвращает порог, enabled и сумму за месяц по указанной карте
    2: Отдельный GET-метод сервиса настроек возвращает только порог и enabled, сумму за месяц отдаёт сервис расходов
    3: Сумма за месяц считается на клиенте по истории операций
  recommended: 'Первый вариант: один запрос на экран, единый источник истины и отсутствие дублирования логики подсчёта
    на клиенте.'
  findings:
  - D-003
  - D-009
  answer: ''
- id: Q-06
  priority: 1
  addressee: Бизнес
  question: Месяц расхода определяется по дате совершения покупки или по дате её проведения, и что происходит с
    январской покупкой, проведённой в феврале?
  options:
    1: Месяц по дате совершения покупки; при позднем проведении январский итог пересчитывается, но push по январю
      в феврале не отправляется
    2: Месяц по дате совершения покупки; при позднем проведении январский итог пересчитывается и push может уйти
      в феврале
    3: Месяц по дате проведения операции
  recommended: 'Первый вариант: он исключает push по прошлому месяцу и сохраняет корректность итогов; критерий приёмки
    при этом нужно переписать под суммы операций.'
  findings:
  - D-004
  - D-016
  answer: ''
- id: Q-07
  priority: 2
  addressee: Бизнес
  question: Что считается моментом покупки для уведомления — авторизация или проведение операции, какая задержка
    push допустима и входит ли фактическая доставка на устройство в обязательства системы?
  options:
    1: 'Событие — проведение операции, SLA: 95 % передач в сервис push за 60 секунд от получения события; доставка
      на устройство не гарантируется'
    2: Событие — авторизация, SLA тот же, доставка на устройство не гарантируется
    3: Событие — проведение, но обязательство включает подтверждённую доставку на устройство с повторной отправкой
  recommended: 'Первый вариант: он соответствует уже описанному в BPMN событию и формулировке НФТ, требует лишь
    добавить процентиль и точку отсчёта.'
  findings:
  - D-007
  - D-018
  - D-022
  answer: ''
- id: Q-08
  priority: 2
  addressee: Архитектор
  question: Что происходит с уведомлением и с проведением покупки, если сервис расходов, сервис настроек или сервис
    push недоступен в момент достижения порога?
  options:
    1: Покупка проводится без блокировки; событие ставится в очередь и обрабатывается с повтором, push отправляется
      после восстановления
    2: Покупка проводится без блокировки; при недоступности сервиса расходов событие теряется, push не отправляется
    3: Проведение покупки блокируется до успешной обработки события
  recommended: 'Первый вариант: уведомление не должно влиять на проведение операции, а потеря события искажает накопленную
    сумму месяца.'
  findings:
  - D-008
  answer: ''
- id: Q-09
  priority: 2
  addressee: Интеграции
  question: По какому признаку операция относится к покупке, переводу или снятию — тип операции в процессинге или
    MCC, и как учитываются возвраты, включая возврат в другом месяце и возврат больше накопленной суммы?
  options:
    1: Классификация по типу операции процессинга; возврат уменьшает месяц исходной покупки, счётчик может стать
      отрицательным
    2: Классификация по MCC из справочника; возврат уменьшает месяц исходной покупки, отрицательное значение запрещено
      (минимум 0)
    3: Классификация по типу операции процессинга; возврат уменьшает месяц проведения возврата
  recommended: 'Первый вариант с явным перечнем MCC в приложении: тип операции процессинга надёжнее MCC, а привязка
    возврата к месяцу покупки сохраняет корректность итогов.'
  findings:
  - D-014
  - D-015
  answer: ''
- id: Q-10
  priority: 2
  addressee: Архитектор
  question: В каких единицах хранится и сравнивается порог и накопленная сумма расходов — тенге или тиыны, и на
    каком слое выполняется перевод ×100?
  options:
    1: Хранить и сравнивать всё в тиынах, перевод в тенге только на границе API и UI
    2: Хранить и сравнивать всё в тенге с округлением до целого
    3: Хранить порог в тенге, сумму в тиынах и приводить единицы явно в правиле сравнения
  recommended: 'Первый вариант: целочисленные тиыны исключают ошибки округления и делают сравнение однозначным.'
  findings:
  - D-023
  answer: ''
- id: Q-11
  priority: 2
  addressee: Аналитик
  question: Какой тип считать эталонным для amount и enabled в контракте — integer в запросе и ответе или string
    в ответе, и сохраняем ли имя amount или переименовываем в limitKzt?
  options:
    1: Integer в запросе и ответе, имя поля единое — limit_kzt во всех методах
    2: Integer в запросе и ответе, имя amount сохраняется как есть
    3: 'Оставить как есть: ответ намеренно отдаёт строки amount и enabled'
  recommended: 'Первый вариант: единый тип и единое имя исключают расхождения при генерации клиента и при трассировке
    на модель данных.'
  findings:
  - D-031
  answer: ''
- id: Q-12
  priority: 2
  addressee: Бизнес
  question: Что должен вернуть метод и что происходит с настройкой, если карта заблокирована, просрочена или открыта
    не в KZT, а также кто вправе задавать порог по дополнительной карте — владелец счёта или её держатель?
  options:
    1: Настройка доступна только держателю активной карты KZT; для остальных карт — 404 без сохранения настройки
    2: Настройка доступна владельцу счёта для любой своей карты, включая дополнительные и валютные
    3: Настройка доступна держателю активной карты KZT, для заблокированной карты — 403 с сохранением прежних настроек
  recommended: 'Первый вариант: он прямо продолжает ограничение Ф-1, не раскрывает существование чужих карт и не
    требует новых прав.'
  findings:
  - D-010
  - D-012
  - D-013
  answer: ''
- id: Q-13
  priority: 2
  addressee: Интеграции
  question: По какому идентификатору сервис push определяет получателя уведомления и передаётся ли этот идентификатор
    в сообщении, если в нём сейчас только последние четыре цифры карты и сумма?
  options:
    1: Идентификатор клиента и токен устройства подписки передаются в сообщении вместе с суммой и последними четырьмя
      цифрами
    2: Достаточно идентификатора карты, сервис push сам находит подписки клиента
    3: Последние четыре цифры карты и есть идентификатор получателя
  recommended: 'Первый вариант: он не опирается на предположение, что сервис push умеет разрешать карту в подписку,
    и явно перечисляет всех адресатов.'
  findings:
  - D-020
  answer: ''
- id: Q-14
  priority: 2
  addressee: Интеграции
  question: Какие поля содержит событие процессинга о покупке и возврате, и какое поле является ключом дедупликации
    при повторе с изменённой суммой?
  options:
    1: Ключ — идентификатор операции процессинга, окно хранения сутки; повтор с изменённой суммой игнорируется
    2: Ключ — идентификатор события процессинга; повтор с изменённой суммой обрабатывается как корректировка
    3: Ключ — пара «идентификатор карты + идентификатор операции», окно — текущий и предыдущий месяц
  recommended: 'Первый вариант: идентификатор операции процессинга стабилен и не меняется при переотправке, а явное
    правило для изменённой суммы закрывает спорный кейс.'
  findings:
  - D-021
  - D-026
  answer: ''
- id: Q-15
  priority: 3
  addressee: Аналитик
  question: Возвращает ли метод когда-либо код 201 и код 403, и обязано ли поле result присутствовать в телах 400,
    401, 404 и 500?
  options:
    1: Всегда 200 при успехе; 403 убрать из контракта; result обязателен во всех ответах, включая ошибки
    2: 200 при обновлении и 201 при первом сохранении настройки; 403 оставить для недействительной сессии, 404 —
      для чужой карты; result во всех ответах
    3: 200 при успехе; 403 и 404 оставить как есть; result только в успешных ответах
  recommended: 'Первый вариант: он убирает неиспользуемый код, делает структуру тела единой и не вводит различие
    между созданием и обновлением, которого не требует бизнес.'
  findings:
  - D-030
  - D-033
  - D-034
  - D-037
  answer: ''
