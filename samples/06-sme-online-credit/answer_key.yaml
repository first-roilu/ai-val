document: samples/06-sme-online-credit/spec.md
level: проработанный
format: ТЗ по структуре ГОСТ 34.602 + технико-экономическое обоснование
topic: онлайн-заявки на кредит для МСБ со скорингом
summary: >-
  ТЗ на автоматизированную систему в структуре ГОСТ 34.602 (общие сведения, цели, объект автоматизации,
  требования к системе, функциям и видам обеспечения, этапы, контроль и приёмка) с ТЭО в приложении.
  Разделы противоречат друг другу по сумме кредита, сегменту, порогам скоринга, времени решения и доле
  онлайн-заявок. В ТЭО NPV посчитан без дисконтирования, окупаемость не сходится с потоками, стоимость
  SaaS умножена на 12 дважды, валовая маржа названа чистой.
defects:
  - id: K-01
    criterion: КОРР
    category: расчёт
    severity: CRITICAL
    location: "А.7 «Показатели эффективности» ↔ А.6 «Денежный поток»"
    quotes:
      - "ставке дисконтирования 20 % (Д-11) — 359,4 млн ₸"
      - "Накопленный денежный поток | −440,0 | −471,0 | −344,6 | −141,4 | 100,2 | 359,4"
    description: >-
      «NPV» 359,4 млн ₸ — это недисконтированная сумма потоков (последнее значение накопленного потока).
      При ставке 20 % NPV = −39,8 млн ₸, IRR ≈ 17 % — ниже стоимости капитала. Вывод «проект экономически
      эффективен» не подтверждается.
    expected_question: "NPV в А.7 посчитан с дисконтированием по ставке 20 %? По потокам из А.6 дисконтированный NPV отрицательный (около −40 млн ₸) — проект всё ещё рекомендуется?"
    fix_hint: "Дисконтировать потоки: NPV = Σ CFt / 1,2^t − 440,0 = −39,8 млн ₸; пересмотреть вывод или параметры проекта."
    unplanned: false
  - id: K-02
    criterion: КОРР
    category: расчёт
    severity: CRITICAL
    location: "А.5 «Выбор платформы скоринга»"
    quotes:
      - "1,5 млн ₸ в месяц | 216,0 | 1 080,0"
      - "Вариант Б дороже варианта А в 9 раз."
    description: >-
      Годовая стоимость подписки умножена на 12 дважды: 1,5 × 12 = 18,0 млн ₸ в год, а не 216,0; за
      5 лет — 90,0 млн ₸, а не 1 080,0. Вариант Б дешевле варианта А (90,0 против 120,0). Выбор платформы
      сделан неверно; при варианте Б NPV проекта становится около +4,9 млн ₸ вместо −39,8.
    expected_question: "Подписка стоит 1,5 млн ₸ в месяц, то есть 18 млн ₸ в год? Тогда SaaS за 5 лет дешевле покупки — пересматриваем выбор варианта?"
    fix_hint: "Исправить годовую стоимость на 18,0 и пятилетнюю на 90,0 млн ₸, пересравнить варианты и пересчитать CAPEX, OPEX и NPV."
    unplanned: false
  - id: K-03
    criterion: КОРР
    category: расчёт
    severity: MAJOR
    location: "А.7 «Срок окупаемости», вывод ↔ А.6"
    quotes:
      - "20 месяцев: 440,0 / 259,2 × 12"
      - "окупается в течение двух лет"
    description: >-
      Окупаемость посчитана делением CAPEX на поток пятого года и не учитывает убыточный первый год и
      постепенный рост потоков. По накопленному потоку А.6 проект окупается в четвёртом году —
      примерно через 43 месяца (3 + 141,4 / 241,6 года).
    expected_question: "Почему срок окупаемости считается по потоку пятого года, если накопленный поток становится положительным только в четвёртом году?"
    fix_hint: "Считать окупаемость по накопленному потоку (≈ 43 месяца) и исправить вывод."
    unplanned: false
  - id: K-04
    criterion: КОРР
    category: расчёт
    severity: MAJOR
    location: "А.7 «Чистая маржа продукта»"
    quotes:
      - "68 %: (450,0 − 144,0) / 450,0"
    description: >-
      По приведённой формуле посчитана валовая маржа (доход минус стоимость риска), а названа она чистой.
      С учётом OPEX и КПН чистая маржа третьего года — (450,0 − 144,0 − 130,0) × 0,8 / 450,0 ≈ 31 %.
    expected_question: "68 % — это маржа до операционных затрат и налога? Какую чистую маржу заявить с учётом OPEX 130 млн ₸ и КПН?"
    fix_hint: "Переименовать показатель в валовую маржу или посчитать чистую маржу ≈ 31 %."
    unplanned: false
  - id: K-05
    criterion: Н-СОГЛ
    category: расчёт
    severity: MAJOR
    location: "2.2 Ц-2 ↔ А.2 «Воронка и объёмы»"
    quotes:
      - "Довести долю онлайн-заявок до 60 % от всех кредитных заявок МСБ к концу второго года эксплуатации."
      - "2 400 / 6 000 = 40 %"
    description: >-
      Цель — 60 % онлайн-заявок к концу второго года, а ТЭО строится на 40 % (2 400 из 6 000). Либо цель
      недостижима при заложенной воронке, либо эффект в ТЭО занижен.
    expected_question: "Какая доля онлайн-заявок является целевой во втором году — 60 % или 40 %? На какой из них строить ТЭО?"
    fix_hint: "Согласовать Ц-2 с воронкой ТЭО или пересчитать воронку под 60 %."
    unplanned: false
  - id: K-06
    criterion: Н-СОГЛ
    category: домен
    severity: CRITICAL
    location: "2.2 Ц-3 ↔ 4.2.1"
    quotes:
      - "Выдавать онлайн беззалоговые кредиты на сумму до 30 млн ₸."
      - "сумма — от 1 до 50 млн ₸"
    description: >-
      Максимальная сумма онлайн-кредита — 30 млн ₸ в целях и 50 млн ₸ в требованиях к функциям. От неё
      зависят правила скоринга, полномочия автоматического решения и кредитный риск.
    expected_question: "Какая максимальная сумма онлайн-кредита — 30 или 50 млн ₸? Нужен ли залог или другое решение для сумм выше 30 млн ₸?"
    fix_hint: "Согласовать максимальную сумму в Ц-3 и 4.2.1."
    unplanned: false
  - id: K-07
    criterion: Н-СОГЛ
    category: домен
    severity: CRITICAL
    location: "4.2.3 ↔ 6.2 ПР-2"
    quotes:
      - "При балле 700 и выше — автоматическое одобрение; при балле от 500 до 699 — ручное рассмотрение кредитным аналитиком"
      - "| ПР-2 | Заявка с баллом 680 | Автоматическое одобрение"
    description: >-
      По 4.2.3 заявка с баллом 680 уходит на ручное рассмотрение, а критерий приёмки ПР-2 ожидает
      автоматическое одобрение. Порог автоматического решения не определён, приёмочный тест противоречит требованию.
    expected_question: "Какой порог автоматического одобрения верен — 700 баллов (4.2.3) или ниже, как в ПР-2?"
    fix_hint: "Исправить ПР-2 (например, балл 720) или порог в 4.2.3."
    unplanned: false
  - id: K-08
    criterion: Н-СОГЛ
    category: время
    severity: MAJOR
    location: "2.2 Ц-1 ↔ 4.1.3, ПР-2"
    quotes:
      - "с 5 рабочих дней до 5 минут для заявок с автоматическим решением"
      - "время принятия автоматического решения — не более 15 минут с момента подачи заявки"
    description: >-
      Цель — 5 минут до автоматического решения, требование и критерий приёмки — 15 минут. Система,
      принятая по ПР-2, может не достигать цели Ц-1.
    expected_question: "Какое время автоматического решения является требованием — 5 или 15 минут?"
    fix_hint: "Согласовать Ц-1 и 4.1.3 и задать процентиль (например, 95 % заявок)."
    unplanned: false
  - id: K-09
    criterion: Н-СОГЛ
    category: домен
    severity: MAJOR
    location: "3.1 ↔ 4.2.1"
    quotes:
      - "индивидуальных предпринимателей (ИП) и товариществ с ограниченной ответственностью (ТОО)"
      - "Заявку подаёт юридическое лицо (ТОО)"
    description: >-
      Объект автоматизации включает ИП, а функция подачи заявки допускает только ТОО. Для ИП не описаны
      требования к стажу, источники данных (у ИП нет БИН) и подписание.
    expected_question: "Могут ли ИП подавать онлайн-заявку? Если да, какие требования к ним и какие источники данных используются?"
    fix_hint: "Добавить ИП в 4.2.1 с отдельными условиями и источниками данных или исключить их из 3.1."
    unplanned: false
  - id: K-10
    criterion: Н-СОГЛ
    category: НФТ
    severity: MAJOR
    location: "4.1.4 «Надёжность»"
    quotes:
      - "потеря данных заявок не допускается (RPO = 0)"
      - "резервное копирование баз данных — ежедневно в 03:00 (UTC+5)"
    description: >-
      RPO = 0 недостижимо, если единственный описанный механизм — ежедневная резервная копия: при отказе
      теряются данные до 24 часов. Нужна синхронная репликация в резервный ЦОД или реалистичный RPO.
    expected_question: "Какой RPO реально требуется и каким механизмом он обеспечивается: синхронная репликация или ежедневные копии?"
    fix_hint: "Указать механизм (синхронная репликация в резервный ЦОД) или изменить RPO (например, 15 минут)."
    unplanned: false
  - id: K-11
    criterion: СООТВ
    category: ИБ
    severity: CRITICAL
    location: "4.1.5 «Безопасность»"
    quotes:
      - "полностью записываются в журнал приложения на уровне DEBUG, включая ИИН и БИН, налоговую отчётность и кредитный отчёт"
    description: >-
      Требование записывать персональные данные, налоговую отчётность и кредитные отчёты в журнал приложения
      нарушает принципы защиты персональных данных и банковской тайны: журналы доступны широкому кругу
      сотрудников и внешним системам сбора логов.
    expected_question: "Какие данные действительно нужны в журнале для разбора инцидентов? Можно ли журналировать только идентификаторы запросов и маскированные ИИН/БИН?"
    fix_hint: "Журналировать идентификатор запроса, источник, время и статус; полные ответы хранить в защищённом хранилище с контролем доступа."
    unplanned: false
  - id: K-12
    criterion: СООТВ
    category: ИБ
    severity: MAJOR
    location: "4.1.5 «Безопасность»"
    quotes:
      - "доступ к АРМ кредитного аналитика предоставляется всем сотрудникам Департамента МСБ по доменной учётной записи"
    description: >-
      Доступ всех сотрудников департамента нарушает принцип минимальных привилегий: кредитные досье
      и решения увидит любой сотрудник. Ролевая модель 4.3.7 при этом не связана с правами.
    expected_question: "Какие роли получают доступ к АРМ и какие действия разрешены каждой роли? Нужен ли журнал аудита действий аналитика?"
    fix_hint: "Описать матрицу «роль — права» для ролей 4.3.7 и журнал аудита решений."
    unplanned: false
  - id: K-13
    criterion: ПОЛН
    category: домен
    severity: MAJOR
    location: "4.2.2 «Сбор данных»"
    quotes:
      - "кредитный отчёт из кредитного бюро по БИН компании и ИИН руководителя"
    description: >-
      Не описано получение согласия клиента и руководителя на запрос кредитного отчёта и сбор данных из
      внешних источников. Без шага согласия автоматический сбор данных юридически и процессно не определён.
    expected_question: "На каком шаге и в какой форме клиент и руководитель дают согласие на запрос в кредитное бюро и госисточники?"
    fix_hint: "Добавить шаг подписания согласия ЭЦП до запуска сбора данных и хранение согласия."
    unplanned: false
  - id: K-14
    criterion: ПРОВ
    category: НФТ
    severity: MAJOR
    location: "4.1.3 «Показатели назначения»"
    quotes:
      - "система должна обеспечивать высокую производительность и удобство работы пользователей"
    description: "Размытое требование без измеримых показателей: по нему нельзя провести испытание."
    expected_question: "Какие числовые показатели производительности (время ответа, процентиль, нагрузка) и удобства (например, доля завершённых заявок) нужны?"
    fix_hint: "Заменить измеримыми показателями или удалить: время решения и нагрузка уже заданы выше."
    unplanned: false
  - id: K-15
    criterion: УМЕСТ
    category: данные
    severity: MINOR
    location: "4.2.7 «АРМ кредитного аналитика»"
    quotes:
      - "Решение сохраняется в таблице APP_DECISION через процедуру PKG_CREDIT.SAVE_DECISION."
    description: "В требованиях к функциям зафиксировано проектное решение — таблица и хранимая процедура. Это решение технического проекта."
    expected_question: "Это ограничение существующей системы или решение можно оставить на этап технического проекта?"
    fix_hint: "Сформулировать требование к сохранению и аудиту решения без указания таблиц и процедур."
    unplanned: false
  - id: K-16
    criterion: Н-РАНЖ
    category: процесс
    severity: MAJOR
    location: "5 «Состав и содержание работ»"
    quotes:
      - "| 2. Разработка, очередь 1 (MVP) | Функции согласно п. 4.2 |"
      - "Доработки по итогам опытной эксплуатации, остальные функции"
    description: >-
      Очередь 1 включает «функции согласно п. 4.2», то есть все, а очередь 2 — «остальные функции».
      Требования не ранжированы по приоритету, состав MVP не определён, хотя на очередь 1 отведено 4 месяца.
    expected_question: "Какие функции п. 4.2 входят в MVP (очередь 1), а какие переносятся в очередь 2?"
    fix_hint: "Присвоить требованиям приоритеты и перечислить функции каждой очереди."
    unplanned: false
  - id: K-17
    criterion: Н-ВАЛИД
    category: домен
    severity: MINOR
    location: "2.2 Ц-4"
    quotes:
      - "Повысить лояльность клиентов МСБ."
    description: "Цель без показателя и целевого значения: по итогам проекта нельзя проверить, достигнута ли она."
    expected_question: "Каким показателем измеряется лояльность (NPS, доля повторных заявок) и какое значение целевое?"
    fix_hint: "Задать показатель и целевое значение, например NPS клиентов МСБ не ниже 40."
    unplanned: false
  - id: K-18
    criterion: ПОЛН
    category: НФТ
    severity: MAJOR
    location: "6.2 ПР-5, ПР-6"
    quotes:
      - "| ПР-5 | Нагрузочное испытание | TBD |"
      - "| ПР-6 | Проверка отказоустойчивости | TBD |"
    description: >-
      Критерии приёмки по нагрузке и отказоустойчивости не заполнены: требования 4.1.3 и 4.1.4 нечем
      принимать.
    expected_question: "Какие ожидаемые результаты нагрузочного испытания и проверки отказоустойчивости (нагрузка, время, RTO/RPO)?"
    fix_hint: "Заполнить ожидаемые результаты по показателям 4.1.3 и 4.1.4."
    unplanned: false
  - id: K-19
    criterion: Н-ПОНЯТ
    category: терминология
    severity: MINOR
    location: "3.2, 4.2.5, 4.2.7, 6.1"
    quotes:
      - "Среднее время рассмотрения обращения"
      - "Очередь кейсов на ручное рассмотрение"
    description: >-
      Заявка называется также «обращением» и «кейсом». Сокращения АРМ, ЭЦП, ПМИ, МСБ не расшифрованы,
      глоссария нет.
    expected_question: "«Обращение» и «кейс» — то же, что «заявка»? Можно ли добавить раздел терминов и сокращений?"
    fix_hint: "Унифицировать термин «заявка» и добавить перечень сокращений."
    unplanned: false
  - id: K-20
    criterion: Н-ТРАСС
    category: трассировка
    severity: MINOR
    location: "6.2 ПР-7 ↔ 4.1.1, 4.2"
    quotes:
      - "Формирование отчётов по п. 4.2.9"
    description: >-
      Пункта 4.2.9 нет: функции заканчиваются на 4.2.8. Подсистема «Отчётность» из 4.1.1 не имеет
      ни одного функционального требования, а критерий приёмки на неё есть.
    expected_question: "Какие отчёты формирует подсистема «Отчётность» и где описаны требования к ним?"
    fix_hint: "Добавить п. 4.2.9 с перечнем отчётов или исключить подсистему и ПР-7."
    unplanned: false
  - id: K-21
    criterion: НЕОБХ
    category: UI
    severity: MINOR
    location: "4.1.6 «Эргономика»"
    quotes:
      - "АРМ кредитного аналитика поддерживает выбор цветовой темы оформления и анимацию переходов между экранами."
    description: >-
      Требование не связано ни с одной целью раздела 2 и не влияет на скорость или качество решения.
      Это затраты без обоснованной ценности для MVP.
    expected_question: "Какую цель обслуживает выбор цветовой темы и анимация в АРМ? Можно ли исключить это из первой очереди?"
    fix_hint: "Удалить требование или перенести в бэклог с обоснованием."
    unplanned: false
  - id: K-22
    criterion: Н-МОДИФ
    category: оформление
    severity: MINOR
    location: "4.1.6 ↔ 4.3.3"
    quotes:
      - "Интерфейс онлайн-заявки — на казахском и русском языках"
      - "Пользовательские интерфейсы — на казахском и русском языках."
    description: >-
      Требование к языкам интерфейса продублировано в двух разделах. При изменении (например, добавлении
      английского) его придётся править в двух местах, и разделы могут разойтись.
    expected_question: "Можно ли оставить требование к языкам только в 4.3.3 «Лингвистическое обеспечение», а в 4.1.6 сослаться на него?"
    fix_hint: "Оставить одно требование и заменить второе ссылкой."
    unplanned: true
traps:
  - id: T-01
    quotes:
      - "Java 21, Spring Boot 3, PostgreSQL 16, Apache Kafka, Kubernetes — в соответствии с технологическим стандартом Банка."
    why_not_defect: >-
      ТЗ по ГОСТ 34.602 содержит раздел требований к программному обеспечению; перечень технологий здесь
      уместен и обоснован стандартом Банка. Это не лишнее проектное решение.
  - id: T-02
    quotes:
      - "кредит 10 млн ₸ на 24 месяца под 24 % годовых — платёж 528 711 ₸"
