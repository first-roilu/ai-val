document: samples/04-transactions-api/spec.md
level: средний
format: дочерняя спецификация REST API (структура части B docs/requirements.md)
topic: история операций по счёту с фильтрами и пагинацией
summary: >-
  Спецификация метода GET со списком операций по счёту. Фильтр по типам передаётся в теле GET, токен в
  примере CURL — в строке запроса, глубина истории указана по-разному, пустой результат возвращается как
  404, размер страницы и формат дат расходятся между разделами, в ответе полный номер карты.
defects:
  - id: K-01
    criterion: СООТВ
    category: API/HTTP
    severity: CRITICAL
    location: "«Общие параметры» (REST type) ↔ «Request body»"
    quotes:
      - "список типов операций для фильтра"
      - "Если тело не передано — возвращаются все типы."
    description: >-
      Для метода GET задано тело запроса с фильтром по типам. У GET нет определённой семантики тела:
      прокси, кеши и часть клиентов его отбрасывают, и фильтр молча не применится.
    expected_question: "Можно ли передавать типы операций query-параметром (например, types=PURCHASE,TRANSFER) или нужен отдельный POST-метод поиска?"
    fix_hint: "Перенести фильтр в query-параметр types (список через запятую) и убрать тело запроса."
    unplanned: false
  - id: K-02
    criterion: СООТВ
    category: ИБ
    severity: CRITICAL
    location: "«Общие параметры»: Authorization ↔ CURL"
    quotes:
      - "access_token=$TOKEN"
      - "Bearer (JWT) в заголовке Authorization"
    description: >-
      Пример CURL передаёт токен в строке запроса, хотя авторизация описана через заголовок. Токен в URL
      попадает в журналы веб-серверов и прокси, в историю и заголовок Referer. Разработчики копируют пример CURL.
    expected_question: "Подтверждаете ли, что токен передаётся только в заголовке Authorization и запросы с access_token в URL должны отклоняться?"
    fix_hint: "Исправить CURL на -H \"Authorization: Bearer $TOKEN\" и явно запретить токен в query-параметрах."
    unplanned: false
  - id: K-03
    criterion: Н-СОГЛ
    category: домен
    severity: CRITICAL
    location: "«Общие параметры» (Description) ↔ «Особые правила», п. 1"
    quotes:
      - "История операций по счёту за последние 12 месяцев"
      - "Доступна история за последние 24 месяца."
    description: >-
      Глубина доступной истории указана как 12 и как 24 месяца. От неё зависят выборка, отказ для старых
      периодов и тесты на границе.
    expected_question: "За какой период доступна история: 12 или 24 месяца? Какой ответ получает клиент при запросе более раннего периода?"
    fix_hint: "Оставить одно значение и описать ответ (код и сообщение) для периода за его пределами."
    unplanned: false
  - id: K-04
    criterion: СООТВ
    category: ИБ
    severity: MAJOR
    location: "«Ответ»: items[].cardNumber, пример 200"
    quotes:
      - "Номер карты, по которой прошла операция"
      - "\"cardNumber\":\"4000001234567899\""
    description: >-
      Метод отдаёт полный номер карты (16 цифр). Это лишние карточные данные в API, журналах и кеше
      приложения и нарушение требований PCI DSS. Для истории достаточно маскированного номера.
    expected_question: "Можно ли возвращать маскированный номер (последние 4 цифры) или идентификатор карты вместо полного номера?"
    fix_hint: "Заменить на cardMask (например, «•••• 7899») или cardId."
    unplanned: false
  - id: K-05
    criterion: Н-СОГЛ
    category: данные
    severity: MAJOR
    location: "Query-параметры dateFrom/dateTo ↔ CURL"
    quotes:
      - "Формат DD.MM.YYYY"
      - "dateFrom=2026-10-01"
    description: >-
      В таблице параметров даты заданы в формате DD.MM.YYYY, а в примере CURL — ISO 8601 (YYYY-MM-DD),
      причём в ответе используется ISO 8601. Неясно, какой формат принимает сервис.
    expected_question: "В каком формате передаются dateFrom и dateTo: DD.MM.YYYY или ISO 8601 (YYYY-MM-DD)?"
    fix_hint: "Унифицировать на ISO 8601 (YYYY-MM-DD) в таблице и в примерах."
    unplanned: false
  - id: K-06
    criterion: ОДНОЗН
    category: время
    severity: MAJOR
    location: "Query-параметры dateFrom/dateTo; «Логика работы метода», п. 4"
    quotes:
      - "Конец периода"
      - "отсортировать по дате операции по убыванию"
    description: >-
      Не сказано, включается ли dateTo в период, по какому часовому поясу считаются границы дня и по
      какой дате отбираются операции: дате совершения или дате списания (для операций PENDING они различаются).
    expected_question: "dateTo включается в период? Границы дня считаются по UTC+5? Фильтр работает по дате совершения или по дате списания?"
    fix_hint: "Записать: «период [dateFrom 00:00; dateTo 23:59:59] по UTC+5, по дате совершения операции»."
    unplanned: false
  - id: K-07
    criterion: Н-СОГЛ
    category: API/HTTP
    severity: MAJOR
    location: "Query-параметр size ↔ «Особые правила», п. 3"
    quotes:
      - "1–1000, по умолчанию 50"
      - "На странице — не более 100 операций."
    description: >-
      Допустимый размер страницы указан как 1–1000 и как не более 100. Неясно, что вернуть при size=500:
      ошибку 400 или 100 записей.
    expected_question: "Какой максимальный size допустим и что возвращается при превышении: 400 или усечённая страница?"
    fix_hint: "Указать один максимум (например, 100) и поведение при превышении."
    unplanned: false
  - id: K-08
    criterion: СООТВ
    category: API/HTTP
    severity: MAJOR
    location: "«Логика работы метода», п. 6; «Статусы», 404"
    quotes:
      - "Если операций нет — вернуть 404 «Операции не найдены»."
      - "если счёт не найден или по фильтру нет операций"
    description: >-
      Пустой результат фильтра — не отсутствие ресурса: по семантике HTTP это 200 с пустым списком.
      Клиент не отличит «нет операций» от «счёт не найден» и покажет ошибку вместо пустого состояния.
    expected_question: "Можно ли для пустого результата возвращать 200 с items: [] и total: 0, оставив 404 только для несуществующего или чужого счёта?"
    fix_hint: "Пустой результат — 200 с пустым массивом; 404 — только для счёта."
    unplanned: false
  - id: K-09
    criterion: ПОЛН
    category: API/HTTP
    severity: MAJOR
    location: "«Особые правила», п. 2; «Статусы», 400"
    quotes:
      - "Период между dateFrom и dateTo — не более 92 дней."
      - "{\"message\":\"Неверные параметры запроса\"}"
    description: >-
      Ответ 400 содержит только общий текст без кода ошибки. Не описано, что возвращается при периоде
      больше 92 дней, dateFrom позже dateTo, amountMin больше amountMax, неизвестном типе операции:
      приложение не сможет показать клиенту причину.
    expected_question: "Какие коды и тексты ошибок возвращаются для каждого нарушения правил фильтра?"
    fix_hint: "Добавить поле code и таблицу ошибок валидации (например, PERIOD_TOO_LONG, DATE_RANGE_INVALID, AMOUNT_RANGE_INVALID)."
    unplanned: false
  - id: K-10
    criterion: ОДНОЗН
    category: данные
    severity: MINOR
    location: "«Ответ»: items[].type"
    quotes:
      - "PURCHASE, TRANSFER, CASH, FEE и т. д."
    description: >-
      Перечень типов операций открыт («и т. д.»): клиент API не знает полного набора значений, фильтр по
      неизвестному типу не определён.
    expected_question: "Каков полный перечень значений type и как клиент должен обрабатывать новые значения?"
    fix_hint: "Привести закрытый перечень значений и правило для неизвестных значений."
    unplanned: false
  - id: K-11
    criterion: Н-СОГЛ
    category: данные
    severity: MINOR
    location: "«Ответ»: items[].operationDate ↔ пример 200"
    quotes:
      - "`items[].operationDate`"
      - "\"date\":\"2026-10-15T14:32:10+05:00\""
    description: "В таблице ответа поле называется operationDate, а в примере — date."
    expected_question: "Как называется поле даты операции: operationDate или date?"
    fix_hint: "Привести пример в соответствие с таблицей."
    unplanned: false
  - id: K-12
    criterion: ПОЛН
    category: ИБ
    severity: MINOR
    location: "«Ответ», «Статусы»"
    quotes:
      - "Ответы 400, 401, 404 и 500 — неуспешные."
    description: >-
      Метод отдаёт персональные финансовые данные страницами до 1000 записей, но ограничение частоты
      запросов (429) не описано. Это открывает массовую выгрузку и перегрузку сервиса.
    expected_question: "Какой лимит запросов на клиента или токен действует для метода и какой ответ возвращается при превышении?"
    fix_hint: "Добавить лимит (например, 60 запросов в минуту на клиента) и ответ 429 с заголовком Retry-After."
    unplanned: false
traps:
  - id: T-01
    quotes:
      - "Если счёт не найден или принадлежит другому клиенту — вернуть 404"
    why_not_defect: >-
      404 вместо 403 для чужого счёта — осознанная защита от перебора идентификаторов: ответ не раскрывает,
      существует ли счёт. Причина указана в тексте.
  - id: T-02
    quotes:
      - "Суммы передаются строкой с двумя знаками после точки"
    why_not_defect: >-
      Строковый тип суммы выбран явно и единообразно для запроса и ответа, чтобы не терять точность на
      float. Это не расхождение типов.
  - id: T-03
    quotes:
      - "`ACCOUNTS.ACC_ID`"
    why_not_defect: >-
      Колонка DB field — обязательная часть банковского шаблона дочерней спецификации API. Указание полей
      БД здесь не является лишним проектным решением в бизнес-требованиях.
