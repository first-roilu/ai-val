document: samples/03-phone-transfers/spec.md
level: средний
format: банковский шаблон «Новый функционал»
topic: переводы по номеру телефона в другие банки
summary: >-
  Банковский шаблон «Новый функционал» на исходящие межбанковские переводы по номеру телефона.
  Таймаут с разблокировкой суммы конфликтует с повторами запроса в СБМП, круглосуточная работа — с
  регламентным окном СБМП, правило комиссии допускает две трактовки, критерии приёмки противоречат
  лимиту, обработка ошибок вынесена в несуществующий пункт.
defects:
  - id: K-01
    criterion: Н-СОГЛ
    category: процесс
    severity: CRITICAL
    location: "Ф-8 ↔ «Требования к интеграции»"
    quotes:
      - "Если СБМП не ответил в течение 30 секунд, перевод отменяется, сумма разблокируется"
      - "При отсутствии ответа запрос в СБМП повторяется до 3 раз с интервалом 10 секунд."
    description: >-
      Через 30 секунд перевод отменяется и сумма разблокируется, но повторные запросы в СБМП
      продолжаются: повтор может исполниться уже после разблокировки, и деньги уйдут получателю,
      оставшись у отправителя. Не описаны идемпотентность повторов и сверка позднего статуса.
    expected_question: "Что происходит, если после отмены по таймауту СБМП исполнит перевод по повторному запросу? Передаётся ли в СБМП уникальный идентификатор, чтобы повтор не создал второй перевод?"
    fix_hint: "Согласовать таймаут и повторы: статус «В обработке» до финального ответа или сверки, повтор с тем же идентификатором перевода, разблокировка только после подтверждённого отказа."
    unplanned: false
  - id: K-02
    criterion: ОСУЩ
    category: НФТ
    severity: CRITICAL
    location: "«Нефункциональные требования» ↔ «Требования к интеграции»"
    quotes:
      - "Сервис переводов работает круглосуточно, 24/7, без плановых простоев."
      - "СБМП ежедневно недоступна с 23:50 до 00:10 (UTC+5)"
    description: >-
      Требование работы без простоев невыполнимо: внешняя СБМП ежедневно недоступна 20 минут. Не
      описано поведение сервиса в это окно — запрет переводов, очередь или отказ.
    expected_question: "Как сервис ведёт себя в окно 23:50–00:10: скрывает кнопку перевода, ставит переводы в очередь или отклоняет их? Как тогда формулируется требование к доступности?"
    fix_hint: "Задать доступность с исключением регламентного окна СБМП и описать поведение и сообщение клиенту в это окно."
    unplanned: false
  - id: K-03
    criterion: ОДНОЗН
    category: расчёт
    severity: CRITICAL
    location: "Ф-6 ↔ «Критерии приемки», строка 1"
    quotes:
      - "переводы свыше 200 000 ₸ — комиссия 0,95 %, минимум 100 ₸"
      - "Комиссия 950 ₸"
    description: >-
      Правило «свыше 200 000 ₸ в месяц — 0,95 %» допускает две трактовки: комиссия со всей суммы
      перевода, пересекающего порог, или только с превышения. Для примера из критерия приёмки это
      950 ₸ или 475 ₸ ((150 000 + 100 000 − 200 000) × 0,95 %). Критерий выбирает первую трактовку, требование её не задаёт.
    expected_question: "Комиссия 0,95 % берётся со всей суммы перевода, при котором превышен порог 200 000 ₸, или только с части сверх порога?"
    fix_hint: "Записать правило явно и привести пример расчёта на пересечении порога."
    unplanned: false
  - id: K-04
    criterion: Н-СОГЛ
    category: домен
    severity: CRITICAL
    location: "Ф-5 ↔ «Критерии приемки», строка 3"
    quotes:
      - "Сумма одного перевода — от 100 ₸ до 1 000 000 ₸ включительно."
      - "Перевод отклонён, сообщение «Превышен лимит на одну операцию»"
    description: >-
      Ф-5 разрешает перевод ровно на 1 000 000 ₸ (граница включена), а критерий приёмки ожидает
      отказ для этой суммы. Тест на граничное значение даст противоположный результат.
    expected_question: "Перевод на 1 000 000 ₸ должен проходить или отклоняться? Какая граница верна — в Ф-5 или в критерии приёмки?"
    fix_hint: "Согласовать границу; если 1 000 000 ₸ разрешено, в критерии приёмки использовать 1 000 001 ₸."
    unplanned: false
  - id: K-05
    criterion: Н-СОГЛ
    category: данные
    severity: MAJOR
    location: "Ф-4 ↔ «Требования к данным»"
    quotes:
      - "СБМП возвращает имя бенефициара в маскированном виде"
      - "полное ФИО получателя"
    description: >-
      Требования к данным предписывают хранить полное ФИО получателя, но по Ф-4 СБМП отдаёт только
      маскированное имя. Источника полного ФИО в описанной интеграции нет.
    expected_question: "Откуда сервис получит полное ФИО получателя, если СБМП возвращает только «Имя Ф.»? Достаточно ли хранить маскированное имя?"
    fix_hint: "Хранить имя в том виде, в каком его вернула СБМП, или указать источник полного ФИО."
    unplanned: false
  - id: K-06
    criterion: СООТВ
    category: ИБ
    severity: MAJOR
    location: "«Требования к данным»"
    quotes:
      - "номер карты отправителя"
    description: >-
      Хранение номера карты целиком в сервисе переводов противоречит требованиям PCI DSS и расширяет
      периметр карточных данных. Для истории и квитанций достаточно маскированного номера или токена.
    expected_question: "Нужен ли сервису переводов полный номер карты или достаточно токена и последних четырёх цифр?"
    fix_hint: "Хранить токен карты и маскированный номер (первые 6 и последние 4 цифры)."
    unplanned: false
  - id: K-07
    criterion: Н-ПОЛН
    category: трассировка
    severity: MAJOR
    location: "«Цели» ↔ «Общие сведения», «Функциональные требования»"
    quotes:
      - "Клиенты Банка могут отправлять и получать переводы по номеру телефона"
      - "Исходящие переводы по номеру телефона клиентам других банков"
    description: >-
      Цель включает получение переводов из других банков, но наименование задачи и все требования
      описывают только исходящие переводы. Входящие переводы (зачисление, уведомление, выбор основного
      банка самим клиентом) не покрыты.
    expected_question: "Входят ли входящие переводы из других банков в объём задачи? Если да, где требования к зачислению и к выбору Банка основным в СБМП?"
    fix_hint: "Сузить цель до исходящих переводов или добавить требования к входящим."
    unplanned: false
  - id: K-08
    criterion: ПРОВ
    category: НФТ
    severity: MAJOR
    location: "«Нефункциональные требования»"
    quotes:
      - "Время выполнения перевода — не более 5 секунд."
    description: >-
      Не заданы границы измерения (от нажатия «Подтвердить» до финального статуса или до передачи в
      СБМП), процентиль и нагрузка. Время ответа СБМП и банка получателя вне контроля Банка, а Ф-8
      допускает ожидание 30 секунд.
    expected_question: "От какого до какого события измеряются 5 секунд, для какого процентиля и при какой нагрузке? Входит ли время ответа СБМП?"
    fix_hint: "Например: «95 % запросов от подтверждения до передачи в СБМП — не более 2 секунд при 40 переводах в секунду»."
    unplanned: false
  - id: K-09
    criterion: ПОЛН
    category: UI
    severity: MAJOR
    location: "«Дизайн процесса UI»"
    quotes:
      - "Макеты — в работе у дизайнера, ссылка будет добавлена."
    description: >-
      Раздел UI — заглушка: макетов нет, экраны ошибок, ожидания статуса и окна недоступности СБМП не
      описаны. Чек-лист ревью сам фиксирует, что UX/UI не покрыт.
    expected_question: "Когда будут макеты и как выглядят экраны ошибок, ожидания статуса и недоступности СБМП?"
    fix_hint: "Приложить ссылку на макеты и описать состояния экранов, включая ошибки."
    unplanned: false
  - id: K-10
    criterion: Н-ПОНЯТ
    category: терминология
    severity: MINOR
    location: "весь документ"
    quotes:
      - "участниками СБМП"
      - "имя бенефициара"
      - "Контрагент выбрал основной банк в СБМП"
    description: >-
      Сокращения СБМП и «Оператор» не расшифрованы. Одна роль названа тремя терминами: получатель,
      бенефициар, контрагент.
    expected_question: "Что такое СБМП и кто Оператор? Можно ли использовать один термин — «получатель»?"
    fix_hint: "Добавить глоссарий и унифицировать термин «получатель»."
    unplanned: false
  - id: K-11
    criterion: ПРОВ
    category: UI
    severity: MINOR
    location: "«Дизайн процесса UI»"
    quotes:
      - "Интерфейс должен быть интуитивно понятным."
    description: "Субъективная формулировка без измеримого критерия, проверить её нельзя."
    expected_question: "По какому критерию принимается понятность интерфейса — UX-тест, доля успешных переводов с первого раза?"
    fix_hint: "Заменить измеримым критерием или удалить, опираясь на макеты."
    unplanned: false
  - id: K-12
    criterion: Н-ТРАСС
    category: трассировка
    severity: MAJOR
    location: "«Требования к интеграции»"
    quotes:
      - "Обработка ошибок, полученных от СБМП, — согласно Ф-11."
    description: >-
      Ф-11 в документе нет: требования заканчиваются на Ф-10. В результате обработка ошибок СБМП,
      отказа антифрода и банка получателя не описана нигде.
    expected_question: "Где описана обработка ошибок СБМП, антифрода и банка получателя? Какие статусы и сообщения видит клиент?"
    fix_hint: "Добавить требование Ф-11 с перечнем ошибок, статусов и сообщений клиенту."
    unplanned: false
  - id: K-13
    criterion: ЕДИН
    category: UI
    severity: MINOR
    location: "Ф-9"
    quotes:
      - "по нему можно скачать квитанцию в PDF и повторить перевод"
    description: >-
      Ф-9 объединяет три требования: запись в истории, квитанцию в PDF и повтор перевода. Их нельзя
      принять по отдельности.
    expected_question: "Можно ли разделить Ф-9 на отображение в истории, квитанцию и повтор перевода с отдельными критериями приёмки?"
    fix_hint: "Разбить Ф-9 на три требования."
    unplanned: false
  - id: K-14
    criterion: ПОЛН
    category: ИБ
    severity: MINOR
    location: "Ф-7"
    quotes:
      - "Перевод на сумму свыше 50 000 ₸ подтверждается одноразовым кодом из SMS."
    description: >-
      Не заданы срок действия одноразового кода, число попыток ввода, повторная отправка и поведение при
      исчерпании попыток. Это может регулировать общий стандарт аутентификации Банка, но ссылки на него нет.
    expected_question: "Какие срок действия кода, лимит попыток и правило повторной отправки действуют для подтверждения перевода? Есть ли ссылка на стандарт аутентификации?"
    fix_hint: "Указать параметры OTP или сослаться на действующий стандарт аутентификации Банка."
    unplanned: true
traps:
  - id: T-01
    quotes:
      - "Принимаются только номера казахстанских операторов в формате +7 7XX XXX XX XX: СБМП обслуживает только такие номера."
    why_not_defect: >-
      Ограничение явное и обосновано внешней системой: номера с кодом +7 вне диапазона 7XX СБМП не
      обслуживает. Это не неполнота.
  - id: T-02
    quotes:
      - "не более 10 запросов в минуту с одного устройства"
    why_not_defect: >-
      Ограничение частоты поиска защищает от перебора номеров и массового сбора имён. Порог, сообщение
      и причина заданы, требование проверяемо.
  - id: T-03
    quotes:
      - "Перевод на меньшую сумму подтверждается PIN-кодом приложения или биометрией."
    why_not_defect: >-
      Это не отсутствие подтверждения, а риск-ориентированная схема: PIN или биометрия — второй фактор
      вместе с владением устройством, SMS-код добавляется для крупных сумм. Действуют лимиты Ф-5.
