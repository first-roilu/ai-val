document: samples/02-cash-limit/spec.md
level: простой
format: короткое ТЗ списком
topic: лимит на снятие наличных, настраиваемый клиентом
summary: >-
  Короткое ТЗ из восьми пунктов с разделами «Ограничения» и «Как проверим». Мгновенное применение
  лимита противоречит пакетной выгрузке в процессинг, сценарий проверки выходит за допустимый
  диапазон, не определены сутки, курс пересчёта и судьба уже установленных лимитов.
defects:
  - id: K-01
    criterion: ОСУЩ
    category: время
    severity: CRITICAL
    location: "п. 4 ↔ «Ограничения»"
    quotes:
      - "Новый лимит начинает действовать сразу после нажатия «Сохранить»."
      - "Изменения из приложения передаются в процессинг пакетом каждые 30 минут."
    description: >-
      Требование «сразу после сохранения» невыполнимо при пакетной передаче в процессинг раз в 30 минут:
      клиент, понизивший лимит после потери карты, до 30 минут остаётся незащищённым.
    expected_question: "Какую задержку применения лимита допускает бизнес? Нужна ли онлайн-передача в процессинг хотя бы для понижения лимита и запрета снятия?"
    fix_hint: "Указать допустимую задержку (например, не более 1 минуты для понижения и запрета) и способ передачи изменений в процессинг."
    unplanned: false
  - id: K-02
    criterion: Н-СОГЛ
    category: домен
    severity: CRITICAL
    location: "п. 2 ↔ «Как проверим», сценарий 3"
    quotes:
      - "Лимит задаётся в диапазоне от 0 до 1 000 000 ₸ с шагом 1 000 ₸."
      - "Установить лимит 1 500 000 ₸ с подтверждением по SMS"
    description: >-
      Сценарий проверки устанавливает лимит 1 500 000 ₸ и ожидает успешное снятие 1 200 000 ₸, хотя
      п. 2 ограничивает лимит 1 000 000 ₸. Ожидаемый результат теста противоречит требованию.
    expected_question: "Какой максимальный лимит может установить клиент: 1 000 000 ₸ или больше при подтверждении по SMS?"
    fix_hint: "Согласовать максимум в п. 2 и в сценарии 3; если выше 1 000 000 ₸ разрешено с SMS, указать новый верхний предел."
    unplanned: false
  - id: K-03
    criterion: ОДНОЗН
    category: время
    severity: MAJOR
    location: "п. 1 и п. 3"
    quotes:
      - "дневной лимит на снятие наличных"
      - "лимит 500 000 ₸ в сутки"
    description: >-
      «Дневной лимит» и «в сутки» допускают две трактовки: календарный день (по какому часовому поясу)
      или скользящие 24 часа. Для снятия за рубежом это особенно важно.
    expected_question: "Лимит считается за календарный день по времени Казахстана (UTC+5) с обнулением в 00:00 или за скользящие 24 часа?"
    fix_hint: "Записать: «лимит действует на календарный день по времени UTC+5, счётчик обнуляется в 00:00»."
    unplanned: false
  - id: K-04
    criterion: ПОЛН
    category: единицы
    severity: MAJOR
    location: "п. 5"
    quotes:
      - "Снятие в валюте пересчитывается в тенге."
    description: >-
      Не указан курс пересчёта (Банка, платёжной системы), момент пересчёта (авторизация или списание)
      и учитываются ли комиссии в сумме, сравниваемой с лимитом.
    expected_question: "По какому курсу и на какой момент пересчитывается валютное снятие и входит ли комиссия в сумму, проверяемую по лимиту?"
    fix_hint: "Указать источник курса, момент пересчёта и состав суммы, сравниваемой с лимитом."
    unplanned: false
  - id: K-05
    criterion: ПОЛН
    category: данные
    severity: MAJOR
    location: "п. 3"
    quotes:
      - "По умолчанию для всех карт действует лимит 500 000 ₸ в сутки."
    description: >-
      Не сказано, что происходит с картами, для которых лимит уже изменён через колл-центр: будет ли он
      перезаписан значением по умолчанию при запуске. Нет правила миграции существующих настроек.
    expected_question: "Сохраняются ли индивидуальные лимиты, установленные ранее через колл-центр, или все карты получают 500 000 ₸?"
    fix_hint: "Добавить правило: значение по умолчанию применяется только к картам без индивидуального лимита; действующие лимиты переносятся без изменений."
    unplanned: false
  - id: K-06
    criterion: ПОЛН
    category: ИБ
    severity: MAJOR
    location: "п. 6"
    quotes:
      - "Повышение лимита выше 500 000 ₸ подтверждается кодом из SMS. Понижение — без подтверждения."
    description: >-
      Не заданы срок жизни кода, число попыток ввода и повторной отправки. Повышение с 0 (снятие
      запрещено после потери карты) до 500 000 ₸ проходит без подтверждения — злоумышленник с доступом
      к приложению снимет запрет.
    expected_question: "Нужно ли подтверждение при снятии запрета (повышении с 0) и какие срок жизни кода и число попыток ввода допускаются?"
    fix_hint: "Требовать подтверждение для любого повышения лимита или для снятия запрета; задать срок жизни кода, лимит попыток и блокировку."
    unplanned: false
  - id: K-07
    criterion: ПРОВ
    category: процесс
    severity: MINOR
    location: "п. 7"
    quotes:
      - "клиенту приходит SMS с причиной отказа"
    description: >-
      Доставка SMS вне контроля Банка, поэтому «приходит» проверить нельзя. Текст сообщения и перечень
      причин отказа не заданы.
    expected_question: "Какой текст SMS отправляется при отказе и что именно проверяется: факт отправки сообщения Банком или его доставка?"
    fix_hint: "Переформулировать как «Банк отправляет SMS с текстом …» и привести шаблон сообщения."
    unplanned: false
  - id: K-08
    criterion: УМЕСТ
    category: данные
    severity: MINOR
    location: "п. 8"
    quotes:
      - "Значение лимита хранить в таблице CARD_LIMITS (Oracle), поле CASH_DAY_LIMIT типа NUMBER(12,2)."
    description: >-
      В бизнес-ТЗ зафиксировано проектное решение: СУБД, таблица и тип поля. При этом в «Ограничениях»
      сказано, что лимиты хранятся в процессинге, то есть место хранения выбирает не заказчик.
    expected_question: "Требование к хранению — это ограничение бизнеса или решение можно оставить архитектору и команде процессинга?"
    fix_hint: "Убрать п. 8 или заменить его требованием к данным без указания СУБД и таблиц."
    unplanned: false
traps: []
