document: samples/08-scheduled-autopay/spec.md
level: контрольный
format: банковский шаблон «Новый функционал», написанный тщательно
topic: автоплатёж по расписанию
summary: >-
  Контрольный «чистый» документ для проверки ложных срабатываний. Термины определены, граничные случаи
  (31-е число, выходные, нехватка средств, повторная передача) описаны, НФТ измеримы, у требований есть
  критерии приёмки. Есть только два мелких замечания по трассировке и терминологии.
defects:
  - id: K-01
    criterion: Н-ТРАСС
    category: трассировка
    severity: MINOR
    location: "Ф-1, Ф-10 ↔ «Критерии приемки»"
    quotes:
      - "Создание подтверждается PIN-кодом приложения или биометрией."
      - "Push не отправляется, если клиент отключил уведомления в настройках приложения."
    description: >-
      У Ф-1 и Ф-10 нет собственных критериев приёмки: подтверждение создания PIN-кодом или биометрией и
      отсутствие push при отключённых уведомлениях не проверяются ни одним КП.
    expected_question: "Можно ли добавить критерии приёмки для подтверждения создания автоплатежа и для случая отключённых уведомлений?"
    fix_hint: "Добавить КП для Ф-1 (создание без подтверждения невозможно) и для Ф-10 (уведомления отключены — push не отправлен, исполнение выполнено)."
    unplanned: false
  - id: K-02
    criterion: Н-ПОНЯТ
    category: терминология
    severity: MINOR
    location: "«Цели»"
    quotes:
      - "Клиент один раз настраивает регулярный платёж"
    description: >-
      В целях используется «регулярный платёж», хотя в разделе «Термины» определён «автоплатёж». Синоним
      мелкий, но нарушает единообразие терминологии.
    expected_question: "«Регулярный платёж» в целях — то же самое, что «автоплатёж» из раздела «Термины»?"
    fix_hint: "Заменить на «автоплатёж»."
    unplanned: false
traps:
  - id: T-01
    quotes:
      - "Если в месяце нет числа первого исполнения (29, 30 или 31), автоплатёж исполняется в последний день этого месяца."
    why_not_defect: >-
      Граничный случай коротких месяцев разобран явно и покрыт КП-4 и КП-5 (включая возврат к 31-му числу
      в следующем месяце). Это не неполнота и не двусмысленность.
  - id: T-02
    quotes:
      - "Даты исполнения не переносятся с выходных и праздничных дней"
    why_not_defect: >-
      Отказ от переноса обоснован круглосуточным проведением платежей и подтверждён КП-6. Это осознанное
      правило, а не пропущенный случай.
  - id: T-03
    quotes:
      - "У клиента может быть не более 20 автоплатежей в статусах «Активен» и «Приостановлен» в сумме."
    why_not_defect: >-
      Ограничение явно обосновано (защита от ошибочного массового создания и антифрод), сообщение задано,
      случай покрыт КП-11.
  - id: T-04
    quotes:
      - "Частичное списание не выполняется."
    why_not_defect: >-
      Поведение при нехватке средств задано полностью: три попытки по расписанию, без частичного списания,
      итоговый статус и следующая дата. Ограничение сознательное.
