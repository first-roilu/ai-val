document: samples/07-qr-acquiring/spec.md
level: проработанный
format: продуктовое ТЗ (user stories, Given/When/Then, бюджет, юнит-экономика, тарифы)
topic: QR-эквайринг для малого бизнеса
summary: >-
  Продуктовое ТЗ с North Star Metric, воронкой, тарифами, юнит-экономикой, бюджетом проекта, user stories
  с критериями Given/When/Then, НФТ и интеграциями. LTV посчитан по выручке, и вывод о масштабировании
  неверен. Пример комиссии в критерии приёмки ошибочен в 10 раз, лицензия в USD не вошла в итог бюджета,
  KPI активных продавцов не учитывает отток. Истории противоречат тарифам, НФТ и ограничениям MVP.
defects:
  - id: K-01
    criterion: КОРР
    category: расчёт
    severity: CRITICAL
    location: "US-4, AC-4.2 ↔ п. 3 «Тарифы»"
    quotes:
      - "продавцу зачисляется 13 575 ₸, комиссия — 1 425 ₸"
    description: >-
      0,95 % от 15 000 ₸ — 142,50 ₸, к зачислению 14 857,50 ₸. В критерии приёмки комиссия завышена в
      10 раз (взято 9,5 %). Реализация, сделанная под этот тест, будет списывать с продавца в 10 раз больше тарифа.
    expected_question: "Ожидаемый результат AC-4.2 — комиссия 142,50 ₸ и зачисление 14 857,50 ₸? Можно исправить критерий?"
    fix_hint: "Исправить AC-4.2: комиссия 142,50 ₸, к зачислению 14 857,50 ₸."
    unplanned: false
  - id: K-02
    criterion: КОРР
    category: расчёт
    severity: CRITICAL
    location: "п. 4 «Юнит-экономика»"
    quotes:
      - "LTV | 11 400 × 25 | 285 000 ₸"
      - "LTV / CAC | 285 000 / 75 000 | 3,8"
      - "Окупаемость CAC | 75 000 / 11 400 | 6,6 месяца"
      - "LTV / CAC выше целевого порога 3,0"
    description: >-
      LTV и окупаемость CAC посчитаны по выручке (комиссии 11 400 ₸), а не по маржинальному доходу
      (6 600 ₸). Корректно: LTV = 6 600 × 25 = 165 000 ₸, LTV / CAC = 2,2, окупаемость CAC — 11,4 месяца.
      Порог 3,0 не достигнут, и решение о масштабировании на все регионы не обосновано.
    expected_question: "LTV считается по маржинальному доходу? Тогда LTV / CAC = 2,2 при пороге 3,0 — как снижать CAC или повышать маржу до масштабирования?"
    fix_hint: "Пересчитать LTV, LTV / CAC и окупаемость по маржинальному доходу и пересмотреть вывод."
    unplanned: false
  - id: K-03
    criterion: КОРР
    category: расчёт
    severity: MAJOR
    location: "п. 5 «Бюджет» ↔ п. 9 (курс)"
    quotes:
      - "12 000 USD"
      - "**123,0 млн ₸**"
    description: >-
      Лицензия указана в долларах и не пересчитана в тенге: итог 123,0 млн ₸ — это сумма тенговых
      статей с резервом без лицензии. При курсе бюджетирования 500 ₸/USD лицензия стоит 6,0 млн ₸, а с
      резервом 10 % итог — 129,6 млн ₸.
    expected_question: "Включена ли лицензия SDK (12 000 USD) в итог бюджета? По курсу 500 ₸/USD это 6,0 млн ₸ — итог 129,6 млн ₸?"
    fix_hint: "Пересчитать лицензию по курсу из допущений, включить её в базу резерва и в итог."
    unplanned: false
  - id: K-04
    criterion: КОРР
    category: расчёт
    severity: MAJOR
    location: "п. 2 «Метрики успеха» ↔ п. 4 (отток)"
    quotes:
      - "Цель — 9 000 активных продавцов к концу первого года."
      - "Отток активных продавцов — 4 % в месяц (п. 4)."
      - "12 000 × 75 %"
    description: >-
      9 000 — это число активаций за год, а не активных продавцов на конец года: отток 4 % в месяц не
      учтён. При 750 активациях в месяц и оттоке 4 % к концу года активных будет около 7 260.
    expected_question: "Цель 9 000 — это активации за год или активные продавцы на конец года с учётом оттока 4 %?"
    fix_hint: "Пересчитать North Star с оттоком (≈ 7 260) или увеличить план подключений для 9 000 активных."
    unplanned: false
  - id: K-05
    criterion: Н-СОГЛ
    category: время
    severity: CRITICAL
    location: "п. 3 «Тарифы», US-3 ↔ AC-3.1"
    quotes:
      - "мгновенно, 24/7 (T+0)"
      - "наступает следующий рабочий день"
    description: >-
      Тариф и US-3 обещают мгновенное зачисление 24/7, а критерий приёмки AC-3.1 проверяет зачисление
      на следующий рабочий день. Система, прошедшая приёмку, не выполняет тарифное обещание.
    expected_question: "Деньги зачисляются продавцу мгновенно (T+0) или на следующий рабочий день? Что делать с оплатами в выходные?"
    fix_hint: "Согласовать тариф, US-3 и AC-3.1 и указать допустимую задержку зачисления."
    unplanned: false
  - id: K-06
    criterion: Н-СОГЛ
    category: время
    severity: MAJOR
    location: "US-2, AC-2.1 ↔ НФТ-3"
    quotes:
      - "оплата отображается не позднее 1 минуты после оплаты"
      - "отображение оплаты в ленте — не позднее 5 секунд после подтверждения оплаты"
    description: >-
      Критерий приёмки допускает 1 минуту, НФТ — 5 секунд. «В реальном времени» в истории тоже не
      определено. Непонятно, по какому значению принимать.
    expected_question: "Какая задержка отображения оплаты в ленте допустима — 5 секунд или 1 минута?"
    fix_hint: "Привести AC-2.1 к НФТ-3 (5 секунд) или изменить НФТ-3."
    unplanned: false
  - id: K-07
    criterion: Н-СОГЛ
    category: домен
    severity: CRITICAL
    location: "п. 1 «Цель», US-5, бэклог MVP ↔ п. 9 «Ограничения MVP»"
    quotes:
      - "принимать оплату от покупателей любых банков"
      - "Оплата по QR в MVP — только из мобильного приложения Банка"
      - "Бэклог MVP — все истории этого раздела."
    description: >-
      US-5 (оплата из приложения любого банка) входит в бэклог MVP, а ограничения MVP разрешают оплату
      только из приложения Банка. AC-5.1 невозможно выполнить в MVP, цель продукта в первой версии недостижима.
    expected_question: "Входит ли оплата из приложений других банков в MVP? Если нет, можно исключить US-5 из бэклога MVP и уточнить цель?"
    fix_hint: "Перенести US-5 в следующий релиз или убрать ограничение, если межбанковская схема будет готова к запуску."
    unplanned: false
  - id: K-08
    criterion: Н-СОГЛ
    category: трассировка
    severity: MAJOR
    location: "US-9 ↔ п. 10 «Вне рамок MVP»"
    quotes:
      - "Как покупатель, я хочу оставить чаевые при оплате по QR"
      - "Чаевые и разделение счёта между покупателями."
    description: "Чаевые объявлены вне рамок MVP, но US-9 с критерием приёмки входит в бэклог MVP."
    expected_question: "Чаевые входят в MVP? Если нет, можно убрать US-9 из бэклога?"
    fix_hint: "Исключить US-9 из MVP или убрать чаевые из раздела «Вне рамок»."
    unplanned: false
  - id: K-09
    criterion: Н-ТРАСС
    category: трассировка
    severity: MAJOR
    location: "US-7"
    quotes:
      - "Как продавец, я хочу оформить возврат покупателю из кабинета"
    description: "У истории US-7 (возврат) нет ни одного критерия приёмки: её нельзя ни протестировать, ни принять."
    expected_question: "Какие критерии приёмки у возврата: сроки, статусы, сообщения покупателю и продавцу?"
    fix_hint: "Добавить AC-7.x в формате Given/When/Then."
    unplanned: false
  - id: K-10
    criterion: ПОЛН
    category: процесс
    severity: MAJOR
    location: "US-7 ↔ п. 3 «Тарифы»"
    quotes:
      - "чтобы решать спорные ситуации без визита в Банк"
      - "Комиссия рассчитывается от суммы каждой оплаты"
    description: >-
      Не описаны частичный возврат, срок возврата, возврат после зачисления денег продавцу (недостаточно
      средств на счёте), возвращается ли продавцу комиссия 0,95 % и куда возвращаются деньги покупателю другого банка.
    expected_question: "Разрешён ли частичный возврат, возвращается ли комиссия при возврате и что делать, если на счёте продавца недостаточно средств?"
    fix_hint: "Описать правила возврата и строку тарифа «Возврат покупателю»."
    unplanned: false
  - id: K-11
    criterion: ПОЛН
    category: процесс
    severity: MAJOR
    location: "И-2 ↔ AC-4.1"
    quotes:
      - "Сервис продавцов по событию зачисляет деньги и отправляет продавцу push."
      - "после чего оплата по нему отклоняется с сообщением «QR-код устарел»"
    description: >-
      Не описаны повторная доставка события «Оплата проведена» (риск двойного зачисления), порядок событий
      и случай, когда подтверждение оплаты динамического QR приходит после истечения 10 минут. Не сказано,
      защищён ли динамический QR от повторной оплаты.
    expected_question: "Как сервис обрабатывает повторное событие об одной оплате и подтверждение, пришедшее после истечения QR? Можно ли оплатить динамический QR дважды?"
    fix_hint: "Задать идемпотентность по идентификатору оплаты, однократность оплаты динамического QR и правило для поздних подтверждений."
    unplanned: false
  - id: K-12
    criterion: ПОЛН
    category: ИБ
    severity: MAJOR
    location: "US-8, AC-8.1"
    quotes:
      - "ему доступны приём оплаты, возвраты и выписка по всем торговым точкам продавца"
    description: >-
      Кассир по умолчанию получает возвраты без лимитов и подтверждения владельца и выписку по всем
      точкам. Ролевая модель, ограничения на возвраты и отзыв доступа не описаны. Риск внутреннего мошенничества.
    expected_question: "Какие права у кассира по умолчанию? Нужны ли лимит на возврат, подтверждение владельцем и ограничение по торговой точке?"
    fix_hint: "Описать роли «владелец» и «кассир» с матрицей прав, лимитами возвратов и привязкой к точке."
    unplanned: false
  - id: K-13
    criterion: СООТВ
    category: ИБ
    severity: MAJOR
    location: "И-1 «Генерация QR»"
    quotes:
      - "IBAN расчётного счёта продавца, ИИН или БИН, наименование и MCC"
    description: >-
      Статический QR — публичный носитель, его видит и может прочитать любой. Для ИП ИИН — персональный
      идентификатор физического лица; размещать его в QR избыточно. Для оплаты достаточно идентификатора
      продавца в системе Банка.
    expected_question: "Зачем размещать ИИН/БИН и IBAN в QR, если оплата идёт по идентификатору продавца?"
    fix_hint: "Кодировать в QR только идентификатор продавца (и счёта на оплату), реквизиты получать на стороне Банка."
    unplanned: false
  - id: K-14
    criterion: ОДНОЗН
    category: терминология
    severity: MAJOR
    location: "п. 3 «Тарифы», AC-1.1, US-5"
    quotes:
      - "Комиссия с клиента | 0 ₸"
      - "**Given** у клиента есть расчётный счёт в Банке"
    description: >-
      «Клиент» означает то продавца (AC-1.1), то покупателя (US-5). Строку тарифа «Комиссия с клиента —
      0 ₸» можно прочитать как отсутствие комиссии для продавца, что противоречит MDR 0,95 %.
    expected_question: "В строке тарифа «Комиссия с клиента» имеется в виду покупатель? Можно использовать термины «продавец» и «покупатель» вместо «клиент»?"
    fix_hint: "Заменить «клиент» на «продавец» или «покупатель» по смыслу."
    unplanned: false
  - id: K-15
    criterion: ПРОВ
    category: UI
    severity: MAJOR
    location: "US-1"
    quotes:
      - "за пару минут"
      - "Подключение должно быть максимально простым."
    description: >-
      «За пару минут» и «максимально простым» не измеримы, критерии приёмки US-1 их не проверяют.
    expected_question: "Какое время подключения целевое (например, медиана не более 3 минут от нажатия до готового QR) и как оно измеряется?"
    fix_hint: "Задать измеримую метрику и добавить её в AC-1.1."
    unplanned: false
  - id: K-16
    criterion: ОСУЩ
    category: НФТ
    severity: CRITICAL
    location: "НФТ-1"
    quotes:
      - "Доступность сервиса приёма оплаты по QR — 100 %, 24/7."
    description: >-
      Доступность 100 % недостижима и непроверяема: она исключает любые отказы и обновления. Не указаны
      период измерения и плановые работы.
    expected_question: "Какая целевая доступность (например, 99,9 % в месяц) и как учитываются плановые работы?"
    fix_hint: "Задать реалистичную доступность с периодом измерения и правилами плановых работ."
    unplanned: false
  - id: K-17
    criterion: УМЕСТ
    category: UI
    severity: MINOR
    location: "US-10"
    quotes:
      - "Кабинет продавца — веб-приложение на React 18, состояние хранится в Redux."
    description: "В пользовательской истории зафиксированы фреймворк и библиотека состояния — проектное решение без бизнес-причины."
    expected_question: "Выбор React и Redux — требование заказчика или решение команды?"
    fix_hint: "Убрать из истории; при необходимости перенести в технические ограничения."
    unplanned: false
  - id: K-18
    criterion: Н-ТРАСС
    category: трассировка
    severity: MINOR
    location: "US-10; нумерация историй"
    quotes:
      - "Сверку с кассой — см. US-12."
    description: >-
      Ссылка на несуществующую историю US-12: истории заканчиваются на US-10. В нумерации пропущена US-6.
    expected_question: "Где описана сверка с кассой (US-12) и была ли удалена US-6?"
    fix_hint: "Добавить недостающие истории или исправить ссылку и нумерацию."
    unplanned: false
  - id: K-19
    criterion: Н-ПОНЯТ
    category: терминология
    severity: MINOR
    location: "п. 3, п. 4, п. 8"
    quotes:
      - "Приём оплаты по QR (MDR)"
      - "CAC | 40 000 (агентское вознаграждение)"
    description: "Сокращения MDR, LTV, CAC, MCC, ОФД, FTE не расшифрованы, глоссария нет. Документ читают не только продуктовые специалисты."
    expected_question: "Можно добавить глоссарий сокращений (MDR, LTV, CAC, MCC, ОФД)?"
    fix_hint: "Добавить раздел терминов и сокращений."
    unplanned: false
  - id: K-20
    criterion: ЕДИН
    category: процесс
    severity: MINOR
    location: "US-8"
    quotes:
      - "чтобы они принимали оплату, делали возвраты и выгружали выписку"
    description: >-
      История объединяет три разные потребности с разными рисками и правами: приём оплаты, возвраты,
      выписку. Их сложно оценить и принять по отдельности.
    expected_question: "Можно разделить US-8 на истории по каждому праву кассира?"
    fix_hint: "Разбить US-8 на отдельные истории с собственными критериями приёмки."
    unplanned: false
traps:
  - id: T-01
    quotes:
      - "Статический QR из US-1 действует бессрочно, сумму в нём вводит покупатель."
    why_not_defect: >-
      Бессрочный статический QR и динамический QR на 10 минут — два разных типа кода с явно описанным
      поведением. Противоречия нет.
  - id: T-02
    quotes:
      - "**Точка безубыточности** продукта — 2 000 активных продавцов"
    why_not_defect: >-
      Расчёт верен и использует маржинальный доход, а не выручку: 158,4 млн ₸ / 12 / 6 600 ₸ = 2 000.
      Постоянные затраты раскрыты построчно.
  - id: T-03
    quotes:
      - "Фискальный чек: его формирует онлайн-касса продавца, Банк чек не формирует и в ОФД не передаёт"
    why_not_defect: >-
      Осознанная граница продукта с объяснением: фискализация остаётся на кассе продавца. Это не
      пропущенное требование.
calc_checks:
  - id: C-01
    quote: "1 200 000 × 0,95 %"
    expression: "1200000 * 0.0095"
    stated: 11400
    correct: 11400
    note: "Комиссия Банка на активного продавца в месяц. Верно."
  - id: C-02
    quote: "**6 600 ₸**"
    expression: "11400 - (300 * 3 + 2500 + 1200000 * 0.001 + 200)"
    stated: 6600
    correct: 6600
    note: "Маржинальный доход на продавца. Верно."
  - id: C-03
    quote: "LTV | 11 400 × 25 | 285 000 ₸"
    expression: "6600 * 25"
    stated: 285000
    correct: 165000
    defect: K-02
    note: "LTV посчитан по выручке вместо маржинального дохода."
  - id: C-04
    quote: "LTV / CAC | 285 000 / 75 000 | 3,8"
    expression: "6600 * 25 / 75000"
    stated: 3.8
    correct: 2.2
    defect: K-02
    note: "Ниже целевого порога 3,0."
  - id: C-05
    quote: "Окупаемость CAC | 75 000 / 11 400 | 6,6 месяца"
    expression: "75000 / 6600"
    stated: 6.6
    correct: 11.36
    defect: K-02
    note: "Окупаемость CAC по маржинальному доходу."
  - id: C-06
    quote: "продавцу зачисляется 13 575 ₸, комиссия — 1 425 ₸"
    expression: "15000 * 0.0095"
    stated: 1425
    correct: 142.5
    defect: K-01
    note: "Комиссия 0,95 % от 15 000 ₸."
  - id: C-07
    quote: "продавцу зачисляется 13 575 ₸, комиссия — 1 425 ₸"
    expression: "15000 * (1 - 0.0095)"
    stated: 13575
    correct: 14857.5
    defect: K-01
    note: "Сумма к зачислению продавцу."
  - id: C-08
    quote: "**123,0 млн ₸**"
    expression: "(67.6 + 12000 * 500 / 1e6 + 7.2 + 12.0 + 25.0) * 1.1"
    stated: 123.0
    correct: 129.58
    defect: K-03
    note: "Лицензия 12 000 USD по курсу 500 ₸/USD = 6,0 млн ₸ и резерв 10 % от новой базы."
  - id: C-09
    quote: "Цель — 9 000 активных продавцов к концу первого года."
    expression: "750 * (1 - 0.96**12) / 0.04"
    stated: 9000
    correct: 7261.7
    defect: K-04
    note: >-
