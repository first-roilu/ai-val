document: samples/01-utility-cashback/spec.md
level: простой
format: служебная записка заказчика
topic: кешбэк за оплату коммунальных услуг в мобильном приложении
summary: >-
  Неформальная записка руководителя направления в ИТ: девять пунктов «что нужно сделать» без
  нумерации требований и критериев приёмки. Ставка кешбэка не задана, форма возврата денег
  противоречива, сроки, лимиты и возвраты описаны размыто.
defects:
  - id: K-01
    criterion: ПОЛН
    category: домен
    severity: CRITICAL
    location: "п. 2"
    quotes:
      - "Размер кешбэка — до 5 % от суммы платежа"
      - "Проценты по конкретным поставщикам согласуем с маркетингом позже"
    description: >-
      Ставка кешбэка не определена: «до 5 %» задаёт только верхнюю границу, конкретные проценты
      отложены на потом. Без ставки нельзя ни реализовать начисление, ни написать тест.
    expected_question: "Какой процент кешбэка начисляется по каждому поставщику или категории и кто и когда утверждает этот список?"
    fix_hint: "Привести таблицу «поставщик или категория — ставка, %» или единую ставку и указать владельца справочника ставок."
    unplanned: false
  - id: K-02
    criterion: Н-СОГЛ
    category: домен
    severity: CRITICAL
    location: "п. 5 ↔ п. 6"
    quotes:
      - "что деньги вернулись на карту"
      - "Кешбэк зачисляется бонусами на бонусный счёт клиента"
    description: >-
      П. 5 говорит, что деньги возвращаются на карту, п. 6 — что кешбэк зачисляется бонусами на
      бонусный счёт. Это разные механизмы: проводки, отображение в балансе, налоговые и учётные последствия.
    expected_question: "Кешбэк зачисляется деньгами на карту или бонусами на бонусный счёт? Если бонусами — как и на что клиент может их потратить?"
    fix_hint: "Оставить один механизм зачисления и согласовать с ним формулировку п. 5."
    unplanned: false
  - id: K-03
    criterion: ПРОВ
    category: время
    severity: MAJOR
    location: "п. 5"
    quotes:
      - "Начислять кешбэк быстро, чтобы клиент сразу видел"
    description: >-
      «Быстро» и «сразу» не измеримы. Не ясно, начислять ли кешбэк в момент платежа, после
      подтверждения поставщиком или по итогам дня.
    expected_question: "В какой срок после успешного платежа должен быть начислен кешбэк и от какого события считать этот срок?"
    fix_hint: "Указать измеримый срок, например «не позднее 10 минут после получения статуса «Проведён» от поставщика»."
    unplanned: false
  - id: K-04
    criterion: ОДНОЗН
    category: домен
    severity: MAJOR
    location: "п. 1"
    quotes:
      - "(свет, газ, вода, отопление, вывоз мусора и т. д.)"
    description: >-
      Открытый перечень «и т. д.» не позволяет определить, какие платежи участвуют в акции:
      интернет, телефон, домофон, взносы ОСИ или КСК, капремонт. Нет признака, по которому система отберёт платежи.
    expected_question: "Какой закрытый список поставщиков или категорий платежей считается коммунальными услугами и по какому признаку система их определяет?"
    fix_hint: "Дать закрытый список категорий или кодов поставщиков из справочника платежей."
    unplanned: false
  - id: K-05
    criterion: ОДНОЗН
    category: время
    severity: MAJOR
    location: "п. 4"
    quotes:
      - "Максимум — 2 000 ₸ в месяц на одного клиента"
    description: >-
      Не определено, что такое «месяц»: календарный месяц по дате платежа или по дате начисления,
      или 30 дней. Не сказано, начисляется ли частичный кешбэк, если платёж превышает остаток лимита.
    expected_question: "Лимит 2 000 ₸ считается за календарный месяц по дате платежа (UTC+5)? Если платёж превышает остаток лимита, начисляется ли кешбэк на остаток?"
    fix_hint: "Записать: «не более 2 000 ₸ за календарный месяц по дате платежа (UTC+5); при превышении начисляется остаток до лимита»."
    unplanned: false
  - id: K-06
    criterion: ПОЛН
    category: процесс
    severity: MAJOR
    location: "п. 7"
    quotes:
      - "Если платёж отменили или вернули — кешбэк забираем обратно."
    description: >-
      Не разобраны граничные случаи: бонусы уже потрачены, возврат частичный, возврат пришёл в
      следующем месяце. Не сказано, восстанавливается ли месячный лимит.
    expected_question: "Что делать, если бонусы уже потрачены, если возврат частичный и если он пришёл в другом месяце? Восстанавливается ли лимит месяца?"
    fix_hint: "Описать правило списания: пропорционально сумме возврата, допускается ли отрицательный бонусный баланс, как пересчитывается лимит."
    unplanned: false
  - id: K-07
    criterion: Н-ПОЛН
    category: домен
    severity: MAJOR
    location: "абзац о бюджете акции"
    quotes:
      - "Бюджет акции согласован на комитете — 15 млн ₸ в месяц."
    description: >-
      Бюджет ограничен, но не описано, что происходит при его исчерпании: остановка начислений,
      очередь или перерасход. Нет требования к контролю расходования бюджета.
    expected_question: "Что делает система, когда бюджет 15 млн ₸ за месяц исчерпан: прекращает начисления, начисляет в следующем месяце или продолжает сверх бюджета? Кто получает уведомление?"
    fix_hint: "Добавить требование к счётчику бюджета и поведению при достижении лимита, включая сообщение клиенту."
    unplanned: false
  - id: K-08
    criterion: ПРОВ
    category: НФТ
    severity: MAJOR
    location: "п. 9"
    quotes:
      - "Всё должно работать стабильно и без сбоев"
    description: >-
      Нефункциональное требование без измеримых показателей: нет доступности, времени ответа,
      ожидаемой пиковой нагрузки.
    expected_question: "Какая пиковая нагрузка ожидается в конце месяца (платежей в секунду) и какие целевые доступность и время начисления нужны?"
    fix_hint: "Задать числа: например, доступность 99,5 % в месяц и обработка до N платежей в секунду с начислением в установленный срок."
    unplanned: false
  - id: K-09
    criterion: ОДНОЗН
    category: домен
    severity: MINOR
    location: "вводная часть ↔ п. 3"
    quotes:
      - "Акция для всех клиентов мобильного приложения."
      - "Кешбэк начисляется только при оплате картой Банка."
    description: >-
      «Для всех клиентов» расходится с ограничением «только картой Банка». Не уточнено, какие карты
      считаются: дебетовые, кредитные, виртуальные, дополнительные; учитывается ли оплата со счёта.
    expected_question: "Какие карты и способы оплаты дают право на кешбэк (дебетовые, кредитные, виртуальные, оплата со счёта)?"
    fix_hint: "Перечислить допустимые типы карт и способы оплаты и убрать формулировку «для всех клиентов»."
    unplanned: false
  - id: K-10
    criterion: ЕДИН
    category: UI
    severity: MINOR
    location: "п. 8"
    quotes:
      - "В истории операций показать кешбэк отдельной строкой, после начисления отправить клиенту push, а на главный экран добавить баннер акции."
    description: >-
      В одном пункте три независимых требования: строка в истории, push и баннер. Их нельзя
      проверить и принять по отдельности.
    expected_question: "Можно ли разделить п. 8 на три требования и для каждого указать, что именно отображается и когда?"
    fix_hint: "Разбить на три пункта: строка в истории операций, push о начислении, баннер на главном экране."
    unplanned: false
  - id: K-11
    criterion: ПОЛН
    category: время
    severity: MINOR
    location: "абзац о сроке акции"
    quotes:
      - "Срок акции — 3 месяца с даты запуска, дальше решим по результатам."
    description: >-
      Дата запуска не зафиксирована («до конца января»), поэтому неизвестна дата окончания. Не
      сказано, как обрабатываются платежи на границе срока и что происходит с бонусами после завершения акции.
    expected_question: "Какие точные даты начала и окончания акции и начисляется ли кешбэк за платежи, проведённые до окончания, но подтверждённые после?"
    fix_hint: "Указать даты начала и окончания (UTC+5) и правило для платежей на границе периода."
    unplanned: true
traps: []
