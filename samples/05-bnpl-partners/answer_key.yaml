      - "инвестициях (CAPEX) 214,0 млн ₸"
    description: >-
      Итог таблицы CAPEX (241,0 млн ₸) не равен сумме строк (120,0 + 38,0 + 26,0 + 18,0 + 12,0 = 214,0).
      NPV и окупаемость считаются от 214,0, поэтому неясно, какая сумма инвестиций согласуется. При 241,0 NPV меньше на 27 млн ₸.
    expected_question: "Сколько составляют инвестиции — 214,0 или 241,0 млн ₸? Нет ли статьи, не попавшей в таблицу?"
    fix_hint: "Исправить итог на 214,0 млн ₸ или добавить недостающую статью и пересчитать NPV."
