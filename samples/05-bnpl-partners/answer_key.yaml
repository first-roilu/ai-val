document: samples/05-bnpl-partners/spec.md
level: проработанный
format: BRD + ТЗ
topic: рассрочка (BNPL) у магазинов-партнёров
summary: >-
  Бизнес-обоснование с воронкой, юнит-экономикой, моделью на 3 года, CAPEX, NPV и KPI плюс ТЗ (роли,
  процесс, Ф, правила скоринга, НФТ, интеграции, модель данных, критерии приёмки). Главная ошибка —
  стоимость риска от дохода вместо объёма выдач: после исправления NPV становится отрицательным.
  Плюс противоречия по возрасту, срокам, датам расчётов с партнёром и возвратам, карточные данные в API партнёра.
defects:
  - id: K-01
    criterion: КОРР
    category: расчёт
    severity: CRITICAL
    location: "1.6 «Юнит-экономика» ↔ Д-4; 1.7 «Финансовая модель»"
    quotes:
      - "12 500 × 1,2 %"
      - "1,2 % от объёма выдач"
      - "Стоимость риска | 9,0 | 18,0 | 21,6"
    description: >-
      Стоимость риска посчитана от дохода на рассрочку (12 500 ₸), хотя по Д-4 это 1,2 % от объёма
      выдач: на рассрочку 200 000 ₸ — 2 400 ₸, а не 150 ₸. Ошибка переходит в модель (144,0 / 288,0 /
      345,6 млн ₸ вместо 9,0 / 18,0 / 21,6), маржинальный доход падает с 5 125 до 2 875 ₸. После
      исправления NPV −119,0 млн ₸ (вместе с K-02 — −171,5 млн ₸), проект не окупается за 3 года. Решение о запуске меняется.
    expected_question: "Стоимость риска 1,2 % считается от суммы выдачи, как в Д-4? Тогда CoR — 2 400 ₸ на рассрочку; подтверждаете пересчёт модели и NPV?"
    fix_hint: "Считать CoR как 1,2 % × 200 000 ₸ = 2 400 ₸ на рассрочку, пересчитать модель, NPV, окупаемость и точку безубыточности."
    unplanned: false
