      - "Инфраструктура и лицензии | 2,5 | 2,5 | 2,5"
    description: >-
      В годовой модели стоит месячная сумма: по Д-10 инфраструктура стоит 2,5 млн ₸ в месяц, то есть
      30,0 млн ₸ в год. Постоянные затраты занижены на 27,5 млн ₸ ежегодно, прибыль и NPV завышены.
    expected_question: "Инфраструктура и лицензии стоят 2,5 млн ₸ в месяц (30 млн ₸ в год) или 2,5 млн ₸ в год?"
    fix_hint: "Поставить 30,0 млн ₸ в год и пересчитать постоянные затраты, прибыль и показатели эффективности."
    unplanned: false
  - id: K-03
    criterion: КОРР
    category: расчёт
    severity: MAJOR
    location: "1.8 «Инвестиции (CAPEX)» ↔ 1.9 «Показатели эффективности»"
    quotes:
