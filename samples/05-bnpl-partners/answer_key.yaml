traps:
  - id: T-01
    quotes:
      - "S × r × (n + 1) / 24"
      - "200 000 × 15 % × 7 / 24"
    why_not_defect: >-
      Формула верна: при погашении равными долями в конце месяца средняя задолженность — S × (n + 1) / (2n),
      за n месяцев это даёт S × r × (n + 1) / 24. Значения 5 000 и 8 750 ₸ сходятся и с проверкой через
      средний портфель (5 200 × 15 % = 780 млн ₸).
  - id: T-02
    quotes:
      - "Комиссия партнёра при возврате товара не возвращается: это условие договора с партнёром"
    why_not_defect: "Осознанное и обоснованное условие договора, а не пропуск в процессе возврата."
  - id: T-03
    quotes:
      - "Рассрочка недоступна для подарочных карт и сертификатов"
    why_not_defect: >-
      Обоснованное антифрод-ограничение (риск Р-1), механизм задан: категория товара из И-1 и отказ с
      сообщением (КП-6).
  - id: T-04
    quotes:
      - "полная стоимость покупки, хотя партнёру перечисляется сумма за вычетом комиссии (консервативная оценка)"
    why_not_defect: >-
      Это явное и объяснённое консервативное допущение: фондирование чуть завышено, а не ошибочно посчитано.
